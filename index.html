<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Axionix Photobooth</title>
  <meta name="description" content="Halaman login administrator untuk layanan Axionix Photobooth." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/admin.css" />
</head>

<body class="korean-login-page admin-login-page">

  <!-- City Skyline Silhouette Background -->
  <div class="korean-bg-skyline"></div>
  <div class="korean-bg-glow"></div>

  <!-- Floating Cute Decor Wrappers -->
  <div class="sparkles">
    <span class="sparkle-item s1">✨</span>
    <span class="sparkle-item s2">⭐</span>
    <span class="sparkle-item s3">💕</span>
    <span class="sparkle-item s4">🌸</span>
  </div>
  <div class="clouds">
    <div class="cloud-item c1">☁️</div>
    <div class="cloud-item c2">☁️</div>
  </div>
  <div class="hearts">
    <span class="heart-item h1">💖</span>
    <span class="heart-item h2">💕</span>
  </div>
  <div class="flowers">
    <span class="flower-item f1">🌸</span>
    <span class="flower-item f2">🌸</span>
  </div>

  <!-- SVG Style Asset Wrappers -->
  <div class="background-decoration">

    <!-- Top Left: Cherry Blossom / Ribbon & Speech Bubble -->
    <div class="top-left-decoration">
      <img src="img/Style/07.svg" alt="Ribbon & Cherry Blossom" class="decor-cherry-tree" />
      <div class="speech-bubble-left">
        <span>AXIONIX PHOTO ♡</span>
      </div>
    </div>

    <!-- Top Right: Sparkle Ribbon -->
    <div class="top-right-decoration">
      <span class="floating-star top-star">⭐</span>
    </div>

    <!-- Bottom Left: Polaroid & Photo Strip -->
    <div class="bottom-left-decoration">
      <div class="photo-strip-wrapper">
        <img src="img/Style/06.svg" alt="Photo Strip" class="decor-photostrip" />
        <img src="img/Style/03.svg" alt="Polaroid" class="decor-polaroid" />
      </div>
    </div>

    <!-- Bottom Right / Right Side: Photobooth Machine & Cute Bunny -->
    <div class="bottom-right-decoration">
      <div class="photobooth-machine-wrapper">
        <img src="img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-booth" />
      </div>
      <div class="bunny-wrapper">
        <img src="img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny" />
        <img src="img/Style/05.svg" alt="Bear and Duck" class="decor-bear-duck" />
      </div>
    </div>

    <div class="floating-decoration"></div>
  </div>

  <!-- Main Container -->
  <div class="main-container admin-login-container">

    <!-- Glass Login Card -->
    <div class="glass-login-card login-card admin-login-card">

      <!-- Card Header -->
      <header class="login-header admin-login-header">

        <!-- Brand Logo -->
        <div class="login-brand admin-login-logo">
          <div class="camera-icon-badge">
            <img src="img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
          </div>
          <div class="brand-text-group">
            <span class="brand-name-top">AXIONIX</span>
            <span class="brand-name-bottom">PHOTO</span>
          </div>
        </div>

        <!-- Title & Cute Subtitle Banner -->
        <h1 class="login-title admin-login-title">
          <span>Admin Portal</span>
          <span class="title-star">⭐</span>
        </h1>

        <div class="login-subtitle-banner">
          <span class="login-subtitle admin-login-subtitle">Masuk untuk mengelola photobooth ♡</span>
        </div>
      </header>

      <!-- Form Section -->
      <form class="login-form admin-login-form" onsubmit="event.preventDefault();">

        <!-- Email Input Field -->
        <div class="input-wrapper input-group mb-4">
          <label for="email" class="input-label">
            <span class="input-label-icon">✉️</span>
            <span>Email</span>
          </label>

          <div class="input-field-relative">
            <span class="input-icon-left">👤</span>
            <input type="email" id="email" placeholder="admin@cabang.com" class="input input-lg pill-input" required
              autocomplete="email" />
            <span class="input-icon-right">💕</span>
          </div>
        </div>

        <!-- Password Input Field -->
        <div class="input-wrapper input-group mb-5">
          <label for="password" class="input-label">
            <span class="input-label-icon">🔒</span>
            <span>Password</span>
          </label>

          <div class="input-field-relative">
            <span class="input-icon-left">🔒</span>
            <input type="password" id="password" placeholder="••••••••" class="input input-lg pill-input" required
              autocomplete="current-password" />
            <span class="input-icon-right eye-toggle" title="Toggle Password">👁️</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="login-actions admin-login-actions">

          <div class="primary-action mb-3">
            <button type="button" class="korean-btn-primary btn btn-primary btn-xl btn-block" id="btn-login-user">
              <span class="btn-icon">🐰</span>
              <span class="btn-text">Login User</span>
            </button>
          </div>

          <div class="secondary-action">
            <button type="button" class="korean-btn-secondary btn btn-outline btn-xl btn-block" id="btn-login-admin">
              <span class="btn-icon">📊</span>
              <span class="btn-text">Login Admin Dashboard</span>
              <span class="btn-arrow">›</span>
            </button>
          </div>

        </div>

      </form>

      <!-- Ribbon Divider -->
      <div class="ribbon-divider">
        <div class="dotted-line"></div>
        <div class="ribbon-center-badge">🎀</div>
      </div>

      <!-- Footer Section -->
      <footer class="login-footer text-center">
        <a href="https://www.lti.company/contact" target="_blank" rel="noopener noreferrer" class="support-link">
          <span class="support-icon">🎧</span>
          <span>Butuh bantuan? Hubungi tim support kami! 💌</span>
        </a>
      </footer>

    </div>

  </div>

  <script type="module" src="assets/js/auth.js?v=2"></script>
</body>

</html>
