<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Control — Axionix</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/superadmin.css" />
</head>

<body class="superadmin-page">

  <script>
    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    if (!admin) window.location.href = "../index.html";
    if (admin && admin.role !== "superadmin") window.location.href = "../admin/dashboard.html";
  </script>

  <div class="superadmin-container">

    <!-- Header -->
    <div class="superadmin-header mb-6">
      <div class="customer-logo mb-2">
        <img src="../img/Logo_photobooth_LTI.png" alt="Logo Photobooth" style="width:36px; height:36px;" />
        <span class="customer-logo-text text-gradient-primary">AXIONIX PHOTOBOOTH</span>
      </div>

      <h1 class="superadmin-title">Superadmin Control Center 👑</h1>
      <p class="superadmin-subtitle">Kelola akun administrator, cabang, dan pantau performa bisnis seluruh lokasi.</p>
    </div>

    <!-- Quick Stats Summary -->
    <div class="grid mb-6" style="grid-template-columns:1fr 1fr; gap:var(--space-4);">
      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Total Admin Cabang</span>
          <div class="admin-stat-icon purple">👥</div>
        </div>
        <div class="admin-stat-value" id="countAdmin">0</div>
      </div>

      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Peran Aktif</span>
          <div class="admin-stat-icon blue">🔑</div>
        </div>
        <div class="admin-stat-value text-base font-bold text-primary">Superadmin System</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-col gap-3 mb-6">
      <button onclick="goCreate()" class="btn btn-primary btn-xl btn-block">
        <span>＋ Buat Akun Admin Cabang Baru</span>
      </button>

      <button onclick="goStat()" class="btn btn-outline btn-xl btn-block">
        <span>📊 Lihat Analytics &amp; Statistik Multi-Cabang</span>
      </button>
    </div>

    <!-- Registered Admins Card List -->
    <div class="card p-5" id="adminListCard">
      <div class="text-xs font-bold text-secondary uppercase tracking-wider mb-3">Daftar Admin Terdaftar</div>
      <div id="adminList" class="flex flex-col gap-2">
        <p class="text-xs text-tertiary">Loading daftar admin...</p>
      </div>
    </div>

    <div class="text-center mt-6">
      <button class="btn btn-xs btn-outline text-danger" onclick="logout()">
        <span>🚪 Keluar dari System</span>
      </button>
    </div>

  </div>

  <script>
    let admins = JSON.parse(localStorage.getItem("adminAccounts")) || [];
    const listEl = document.getElementById("adminList");
    const countEl = document.getElementById("countAdmin");

    countEl.textContent = admins.length;

    if (admins.length === 0) {
      listEl.innerHTML = `<p class="text-xs text-tertiary">Belum ada akun admin cabang. Klik "Buat Akun Admin Cabang Baru".</p>`;
    } else {
      listEl.innerHTML = admins.map(a => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:var(--space-3); background:var(--bg-subtle); border-radius:var(--radius-md); border:1px solid var(--border-subtle);">
          <div>
            <div class="text-sm font-bold">${a.username}</div>
            <div class="caption">${a.branch_name || "Cabang"} · ID: ${a.id}</div>
          </div>
          <button class="btn btn-danger btn-xs" onclick="deleteAdmin(${a.id})">Hapus</button>
        </div>
      `).join("");
    }

    function deleteAdmin(id) {
      if (confirm("Apakah Anda yakin ingin menghapus admin ini?")) {
        admins = admins.filter(a => a.id !== id);
        localStorage.setItem("adminAccounts", JSON.stringify(admins));
        location.reload();
      }
    }

    function goCreate() { window.location.href = "buat-admin.html"; }
    function goStat() { window.location.href = "statistik.html"; }
    function logout() {
      localStorage.clear();
      window.location.href = "../index.html";
    }
  </script>
</body>

</html>
