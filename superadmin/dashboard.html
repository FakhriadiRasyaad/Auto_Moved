<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superadmin Control Center — Axionix</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="stylesheet" href="../assets/css/superadmin.css" />
</head>

<body class="superadmin-page">

  <script>
    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    if (!admin) window.location.href = "../index.html";
    if (admin && admin.role !== "superadmin") window.location.href = "../admin/dashboard.html";
  </script>

  <div class="superadmin-container">

    <!-- Header -->
    <div class="superadmin-header mb-6">
      <div class="superadmin-brand-badge">
        <img src="../img/Logo_photobooth_LTI.png" alt="Logo Photobooth" class="superadmin-brand-logo" />
        <span class="superadmin-brand-text">AXIONIX PHOTOBOOTH SYSTEM</span>
      </div>

      <h1 class="superadmin-title">Superadmin Control Center 👑</h1>
      <p class="superadmin-subtitle">Kelola akun administrator, cabang, dan pantau performa bisnis seluruh lokasi secara terpusat.</p>
    </div>

    <!-- Quick Stats Summary -->
    <div class="stats-row mb-6" style="grid-template-columns: 1fr 1fr; gap:20px;">
      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Total Admin Cabang</span>
          <div class="admin-stat-icon purple">👥</div>
        </div>
        <div class="admin-stat-value" id="countAdmin">0</div>
      </div>

      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Peran Aktif</span>
          <div class="admin-stat-icon pink">🔑</div>
        </div>
        <div class="admin-stat-value" style="font-size:22px; color:#FF3385;">Superadmin System</div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px;">
      <button onclick="goCreate()" class="btn btn-primary btn-xl btn-block" style="border-radius:20px; font-weight:800; box-shadow:0 10px 24px rgba(255, 51, 133, 0.35);">
        <span>＋ Buat Akun Admin Cabang Baru</span>
      </button>

      <button onclick="goStat()" class="btn btn-outline btn-xl btn-block" style="border-radius:20px; font-weight:800; border-color:#E2D2ED; color:#7C3AED;">
        <span>📊 Analytics &amp; Statistik Multi-Cabang</span>
      </button>
    </div>

    <!-- Registered Admins Card List -->
    <div class="setting-card" id="adminListCard" style="border-radius:28px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1.5px solid #F0E6F4; padding-bottom:14px;">
        <h2 class="setting-card-title" style="margin-bottom:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#7C3AED;">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Daftar Admin Terdaftar</span>
        </h2>
        <span class="badge badge-neutral" style="font-size:12px; font-weight:800;">Akun Lokal</span>
      </div>

      <div id="adminList" class="flex flex-col gap-2">
        <p class="text-xs text-tertiary">Loading daftar admin...</p>
      </div>
    </div>

    <div class="text-center mt-6" style="margin-top:24px;">
      <button class="btn btn-outline btn-sm text-danger" onclick="logout()" style="border-radius:14px; border-color:#FECDD3; color:#E11D48;">
        <span>🚪 Keluar dari System</span>
      </button>
    </div>

  </div>

  <script>
    let admins = JSON.parse(localStorage.getItem("adminAccounts")) || [];
    const listEl = document.getElementById("adminList");
    const countEl = document.getElementById("countAdmin");

    countEl.textContent = admins.length;

    if (admins.length === 0) {
      listEl.innerHTML = `<div class="empty-state" style="padding:32px; text-align:center;"><div class="empty-state-icon" style="font-size:36px;">👤</div><div class="empty-state-title text-sm" style="font-weight:700; color:#7C6E87; margin-top:8px;">Belum ada akun admin cabang. Klik "Buat Akun Admin Cabang Baru".</div></div>`;
    } else {
      listEl.innerHTML = admins.map(a => `
        <div class="admin-user-item">
          <div style="display:flex; align-items:center; gap:14px;">
            <div class="admin-user-avatar">${(a.username || "A").charAt(0).toUpperCase()}</div>
            <div class="admin-user-details">
              <div class="admin-user-name">${a.username}</div>
              <div class="admin-user-meta">📍 ${a.branch_name || "Cabang"} · ID: ${a.id}</div>
            </div>
          </div>
          <button class="btn btn-danger btn-xs" style="border-radius:10px; padding:6px 14px;" onclick="deleteAdmin(${a.id})">Hapus</button>
        </div>
      `).join("");
    }

    function deleteAdmin(id) {
      if (confirm("Apakah Anda yakin ingin menghapus admin ini?")) {
        admins = admins.filter(a => a.id !== id);
        localStorage.setItem("adminAccounts", JSON.stringify(admins));
        location.reload();
      }
    }

    function goCreate() { window.location.href = "buat-admin.html"; }
    function goStat() { window.location.href = "statistik.html"; }
    function logout() {
      localStorage.clear();
      window.location.href = "../index.html";
    }
  </script>
</body>

</html>
