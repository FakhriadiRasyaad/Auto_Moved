<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Admin Baru — Axionix Superadmin</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="stylesheet" href="../assets/css/superadmin.css" />
</head>

<body class="superadmin-page">

  <script>
    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    if (!admin) window.location.href = "../index.html";
    if (admin && admin.role !== "superadmin") window.location.href = "../admin/dashboard.html";
  </script>

  <div class="superadmin-container max-w-xl" style="max-width:720px;">

    <!-- Top Header -->
    <div class="superadmin-top-nav">
      <div>
        <h1 class="superadmin-page-title">Buat Admin Cabang Baru 👤</h1>
        <p class="superadmin-subtitle" style="text-align:left; margin:0; font-size:12.5px;">Daftarkan akun administrator untuk mengelola titik kios photobooth</p>
      </div>

      <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'" style="border-radius:14px;">
        <span>← Kembali</span>
      </button>
    </div>

    <!-- Alert Banner -->
    <div id="alertBox" class="badge p-3 w-full mb-4 hidden text-left" style="border-radius:14px; font-size:13px; font-weight:700;"></div>

    <!-- Success Card Banner -->
    <div id="successBanner" class="setting-card p-6 mb-6 hidden" style="background:#ECFDF5; border:1.5px solid #10B981; border-radius:28px;">
      <div style="font-size:2.5rem; text-align:center;" class="mb-2">🎉</div>
      <h3 class="font-bold text-lg text-primary mb-1 text-center" style="font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; color:#065F46;">Akun Admin Berhasil Dibuat!</h3>
      <p class="text-xs text-secondary mb-4 text-center" style="color:#047857; font-size:13px;">Salin detail kredensial di bawah ini untuk diserahkan kepada admin cabang:</p>

      <div class="card p-4 mb-4" style="background:#FFFFFF; border-radius:18px; border:1px solid #A7F3D0; padding:18px; line-height:1.6;" id="successInfo"></div>

      <div style="display:flex; gap:12px;">
        <button class="btn btn-primary btn-sm flex-1" onclick="location.reload()" style="border-radius:14px; padding:12px; box-shadow:0 8px 20px rgba(255,51,133,0.35);">＋ Buat Admin Lain</button>
        <button class="btn btn-outline btn-sm flex-1" onclick="window.location.href='dashboard.html'" style="border-radius:14px; padding:12px;">Kembali ke Dashboard</button>
      </div>
    </div>

    <!-- Main Form Card -->
    <div class="setting-card" id="formCard" style="border-radius:28px;">
      <form onsubmit="event.preventDefault(); createAdmin();">

        <!-- Role Selection Cards -->
        <div class="text-xs font-bold text-secondary uppercase tracking-wider mb-2" style="font-size:11px; letter-spacing:1px; color:#8C7B99; margin-bottom:8px;">Pilih Role Akses</div>
        <div class="grid mb-4" style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;">

          <label class="superadmin-role-card selected" id="roleAdminCard" onclick="selectRole('admin')">
            <input type="radio" name="role" value="admin" checked style="display:none;">
            <div style="font-size:1.8rem;" class="mb-1">🏪</div>
            <div class="font-bold text-sm text-primary" style="font-weight:800; color:#261B2E; font-size:14px;">Admin Cabang</div>
            <div class="caption text-secondary" style="font-size:11.5px; color:#7C6E87;">Akses dashboard cabang tunggal</div>
          </label>

          <label class="superadmin-role-card" id="roleSuperadminCard" onclick="selectRole('superadmin')">
            <input type="radio" name="role" value="superadmin" style="display:none;">
            <div style="font-size:1.8rem;" class="mb-1">👑</div>
            <div class="font-bold text-sm text-primary" style="font-weight:800; color:#261B2E; font-size:14px;">Superadmin</div>
            <div class="caption text-secondary" style="font-size:11.5px; color:#7C6E87;">Akses penuh seluruh cabang</div>
          </label>

        </div>

        <!-- Input Fields -->
        <div class="input-group mb-3" style="margin-bottom:16px;">
          <label for="displayName" class="input-label">Nama Tampilan Admin <span class="text-danger">*</span></label>
          <input type="text" id="displayName" placeholder="misal: Admin Store Central" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
        </div>

        <div class="input-group mb-3" style="margin-bottom:16px;">
          <label for="email" class="input-label">Email Administrator <span class="text-danger">*</span></label>
          <input type="email" id="email" placeholder="admin.central@cabang.com" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
        </div>

        <div class="grid mb-4" style="display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px;">
          <div class="input-group">
            <label for="password" class="input-label">Password <span class="text-danger">*</span></label>
            <input type="password" id="password" placeholder="Min. 8 karakter" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
          </div>

          <div class="input-group">
            <label for="passwordConfirm" class="input-label">Konfirmasi Password <span class="text-danger">*</span></label>
            <input type="password" id="passwordConfirm" placeholder="Ulangi password" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
          </div>
        </div>

        <!-- Branch Selector Section -->
        <div class="text-xs font-bold text-secondary uppercase tracking-wider mb-2" style="font-size:11px; letter-spacing:1px; color:#8C7B99; margin-bottom:8px;">Penugasan Cabang</div>
        <div class="card p-4 mb-4" style="background:#FAF7FC; border:1px solid #F0E6F4; border-radius:18px; padding:16px; margin-bottom:24px;">
          <div style="display:flex; gap:10px;" class="mb-2">
            <select id="branchSelect" class="input pill-input flex-1" style="height:48px !important; border-radius:14px !important;">
              <option value="">-- Pilih Cabang --</option>
            </select>
            <button type="button" class="btn btn-outline btn-sm" onclick="toggleNewBranch()" style="border-radius:14px; padding:0 16px;">＋ Buat Baru</button>
          </div>

          <!-- New Branch In-place Form -->
          <div id="newBranchPanel" class="hidden mt-3 pt-3" style="border-top:1px dashed #E5DAD4; margin-top:12px; padding-top:12px;">
            <div class="text-xs font-bold text-primary mb-2" style="font-weight:800; color:#261B2E; font-size:13px; margin-bottom:8px;">Tambah Lokasi Cabang Baru</div>
            <div class="grid mb-2" style="display:grid; grid-template-columns:1.5fr 1fr; gap:10px; margin-bottom:10px;">
              <input type="text" id="newBranchName" placeholder="Nama Cabang (misal: Grand Indonesia)" class="input pill-input" style="height:42px !important; border-radius:12px !important; font-size:13px !important;">
              <input type="text" id="newBranchCode" placeholder="Kode (GI-01)" class="input pill-input" style="height:42px !important; border-radius:12px !important; font-size:13px !important;">
            </div>
            <button type="button" class="btn btn-primary btn-xs btn-block" onclick="saveNewBranch()" style="width:100%; height:40px; border-radius:12px; font-weight:800;">Simpan &amp; Pilih Cabang Ini</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-xl btn-block" id="btnSubmit" style="width:100%; height:52px; border-radius:16px; font-size:16px; font-weight:800; box-shadow:0 10px 24px rgba(255, 51, 133, 0.35);">
          <span>🚀 Daftarkan Akun Admin</span>
        </button>

      </form>
    </div>

  </div>

  <script>
    function selectRole(r) {
      document.querySelectorAll(".superadmin-role-card").forEach(c => c.classList.remove("selected"));
      if (r === "admin") {
        document.getElementById("roleAdminCard").classList.add("selected");
        document.querySelector('input[name="role"][value="admin"]').checked = true;
      } else {
        document.getElementById("roleSuperadminCard").classList.add("selected");
        document.querySelector('input[name="role"][value="superadmin"]').checked = true;
      }
    }

    function toggleNewBranch() {
      const p = document.getElementById("newBranchPanel");
      p.classList.toggle("hidden");
    }

    function showAlert(msg, type) {
      const b = document.getElementById("alertBox");
      b.classList.remove("hidden");
      b.className = "badge p-3 w-full mb-4 text-left " + (type === "error" ? "badge-danger" : "badge-success");
      b.textContent = msg;
    }

    function hideAlert() {
      document.getElementById("alertBox").classList.add("hidden");
    }

    function createAdmin() { if (window._createAdmin) window._createAdmin(); }
    function saveNewBranch() { if (window._saveNewBranch) window._saveNewBranch(); }
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    async function loadBranches(selectId = null) {
      const sel = document.getElementById("branchSelect");
      const { data } = await supabase.from("branches").select("id, name, code").order("name");
      if (data) {
        sel.innerHTML = '<option value="">-- Pilih Cabang --</option>' +
          data.map(b => `<option value="${b.id}">${b.name} (${b.code})</option>`).join("");
        if (selectId) sel.value = selectId;
      }
    }

    window._saveNewBranch = async function () {
      const name = document.getElementById("newBranchName").value.trim();
      const code = document.getElementById("newBranchCode").value.trim().toUpperCase();

      if (!name || !code) { alert("Nama dan kode cabang wajib diisi!"); return; }

      const { data, error } = await supabase.from("branches").insert([{ name, code }]).select().single();
      if (error) { alert("Gagal simpan cabang: " + error.message); return; }

      document.getElementById("newBranchName").value = "";
      document.getElementById("newBranchCode").value = "";
      document.getElementById("newBranchPanel").classList.add("hidden");

      await loadBranches(data.id);
      showAlert(`✅ Cabang "${name}" berhasil dibuat dan dipilih!`, "success");
    };

    window._createAdmin = async function () {
      hideAlert();

      const displayName = document.getElementById("displayName").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;
      const role = document.querySelector('input[name=role]:checked').value;
      const branchId = document.getElementById("branchSelect").value;

      if (!displayName || !email || !password || !branchId) {
        showAlert("Semua field bertanda bintang wajib diisi!", "error"); return;
      }
      if (password.length < 8) {
        showAlert("Password minimal 8 karakter!", "error"); return;
      }
      if (password !== passwordConfirm) {
        showAlert("Konfirmasi password tidak cocok!", "error"); return;
      }

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.textContent = "⏳ Memproses...";

      try {
        const { data: currentSession } = await supabase.auth.getSession();
        const superadminRefreshToken = currentSession?.session?.refresh_token;
        const superadminAccessToken = currentSession?.session?.access_token;

        const { data: authData, error: authError } = await supabase.auth.signUp({
          email, password,
          options: { data: { display_name: displayName, role: role } }
        });

        if (authError) {
          if (superadminRefreshToken) {
            await supabase.auth.setSession({ access_token: superadminAccessToken, refresh_token: superadminRefreshToken });
          }
          btn.disabled = false; btn.textContent = "🚀 Daftarkan Akun Admin";
          showAlert("Gagal daftar: " + authError.message, "error"); return;
        }

        const userId = authData.user.id;

        if (superadminRefreshToken) {
          await supabase.auth.setSession({ access_token: superadminAccessToken, refresh_token: superadminRefreshToken });
        }

        const { error: profileErr } = await supabase.from("profiles").upsert({
          user_id: userId, role: role, branch_id: branchId, display_name: displayName
        }, { onConflict: 'user_id' });

        if (profileErr) {
          btn.disabled = false; btn.textContent = "🚀 Daftarkan Akun Admin";
          showAlert("Gagal buat profil: " + profileErr.message, "error"); return;
        }

        document.getElementById("formCard").style.display = "none";
        document.getElementById("successInfo").innerHTML = `
          <div class="text-xs mb-1"><strong>Nama:</strong> ${displayName}</div>
          <div class="text-xs mb-1"><strong>Email:</strong> ${email}</div>
          <div class="text-xs mb-1"><strong>Password:</strong> ${password}</div>
          <div class="text-xs mb-1"><strong>Role:</strong> ${role}</div>
          <div class="text-xs"><strong>Cabang ID:</strong> ${branchId}</div>
        `;
        document.getElementById("successBanner").classList.remove("hidden");

      } catch (err) {
        btn.disabled = false; btn.textContent = "🚀 Daftarkan Akun Admin";
        showAlert("Error: " + err.message, "error");
      }
    };

    loadBranches();
  </script>
</body>

</html>
