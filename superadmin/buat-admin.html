<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Admin Baru — Axionix Superadmin</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/superadmin.css" />
</head>

<body class="superadmin-page">

  <script>
    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    if (!admin) window.location.href = "../index.html";
    if (admin && admin.role !== "superadmin") window.location.href = "../admin/dashboard.html";
  </script>

  <div class="superadmin-container max-w-xl">

    <!-- Top Header -->
    <div style="display:flex; justify-content:space-between; align-items:center;" class="mb-6">
      <div>
        <h1 class="superadmin-title" style="font-size:var(--text-xl);">Buat Admin Cabang Baru 👤</h1>
        <p class="superadmin-subtitle">Daftarkan akun administrator untuk mengelola titik kios photobooth</p>
      </div>

      <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'">
        <span>← Kembali</span>
      </button>
    </div>

    <!-- Alert Banner -->
    <div id="alertBox" class="badge p-3 w-full mb-4 hidden text-left"></div>

    <!-- Success Card Banner -->
    <div id="successBanner" class="card p-6 mb-6 hidden"
      style="background:var(--color-success-light); border:1px solid var(--color-success);">
      <div style="font-size:2rem;" class="mb-2">🎉</div>
      <h3 class="font-bold text-lg text-primary mb-1">Akun Admin Berhasil Dibuat!</h3>
      <p class="text-xs text-secondary mb-4">Salin detail kredensial di bawah ini untuk diserahkan kepada admin cabang:
      </p>

      <div class="card p-4 mb-4" style="background:#fff;" id="successInfo"></div>

      <div style="display:flex; gap:var(--space-3);">
        <button class="btn btn-primary btn-sm flex-1" onclick="location.reload()">＋ Buat Admin Lain</button>
        <button class="btn btn-outline btn-sm flex-1" onclick="window.location.href='dashboard.html'">Kembali ke
          Dashboard</button>
      </div>
    </div>

    <!-- Main Form Card -->
    <div class="card p-6" id="formCard">
      <form onsubmit="event.preventDefault(); createAdmin();">

        <!-- Role Selection Cards -->
        <div class="text-xs font-bold text-secondary uppercase tracking-wider mb-2">Pilih Role Akses</div>
        <div class="grid mb-4" style="grid-template-columns:1fr 1fr; gap:var(--space-3);">

          <label class="superadmin-role-card selected" id="roleAdminCard" onclick="selectRole('admin')">
            <input type="radio" name="role" value="admin" checked style="display:none;">
            <div style="font-size:1.5rem;" class="mb-1">🏪</div>
            <div class="font-bold text-sm text-primary">Admin Cabang</div>
            <div class="caption text-secondary">Akses dashboard cabang tunggal</div>
          </label>

          <label class="superadmin-role-card" id="roleSuperadminCard" onclick="selectRole('superadmin')">
            <input type="radio" name="role" value="superadmin" style="display:none;">
            <div style="font-size:1.5rem;" class="mb-1">👑</div>
            <div class="font-bold text-sm text-primary">Superadmin</div>
            <div class="caption text-secondary">Akses penuh seluruh cabang</div>
          </label>

        </div>

        <!-- Input Fields -->
        <div class="input-group mb-3">
          <label for="displayName" class="input-label">Nama Tampilan Admin <span class="text-danger">*</span></label>
          <input type="text" id="displayName" placeholder="misal: Admin Store Central" class="input" required>
        </div>

        <div class="input-group mb-3">
          <label for="email" class="input-label">Email Administrator <span class="text-danger">*</span></label>
          <input type="email" id="email" placeholder="admin.central@cabang.com" class="input" required>
        </div>

        <div class="grid mb-4" style="grid-template-columns:1fr 1fr; gap:var(--space-3);">
          <div class="input-group">
            <label for="password" class="input-label">Password <span class="text-danger">*</span></label>
            <input type="password" id="password" placeholder="Min. 8 karakter" class="input" required>
          </div>

          <div class="input-group">
            <label for="passwordConfirm" class="input-label">Konfirmasi Password <span
                class="text-danger">*</span></label>
            <input type="password" id="passwordConfirm" placeholder="Ulangi password" class="input" required>
          </div>
        </div>

        <!-- Branch Selector Section -->
        <div class="text-xs font-bold text-secondary uppercase tracking-wider mb-2">Penugasan Cabang</div>
        <div class="card p-4 mb-4" style="background:var(--bg-subtle);">
          <div style="display:flex; gap:var(--space-2);" class="mb-2">
            <select id="branchSelect" class="select flex-1">
              <option value="">-- Pilih Cabang --</option>
            </select>
            <button type="button" class="btn btn-outline btn-sm" onclick="toggleNewBranch()">＋ Buat Baru</button>
          </div>

          <!-- New Branch In-place Form -->
          <div id="newBranchPanel" class="hidden mt-3 pt-3" style="border-top:1px dashed var(--border-subtle);">
            <div class="text-xs font-bold text-primary mb-2">Tambah Lokasi Cabang Baru</div>
            <div class="grid mb-2" style="grid-template-columns:1.5fr 1fr; gap:var(--space-2);">
              <input type="text" id="newBranchName" placeholder="Nama Cabang (misal: Grand Indonesia)"
                class="input input-sm">
              <input type="text" id="newBranchCode" placeholder="Kode (GI-01)" class="input input-sm">
            </div>
            <button type="button" class="btn btn-primary btn-xs btn-block" onclick="saveNewBranch()">Simpan &amp; Pilih
              Cabang Ini</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-xl btn-block" id="btnSubmit">
          <span>🚀 Daftarkan Akun Admin</span>
        </button>

      </form>
    </div>

  </div>

  <script>
    function selectRole(r) {
      document.querySelectorAll(".superadmin-role-card").forEach(c => c.classList.remove("selected"));
      if (r === "admin") {
        document.getElementById("roleAdminCard").classList.add("selected");
        document.querySelector('input[name="role"][value="admin"]').checked = true;
      } else {
        document.getElementById("roleSuperadminCard").classList.add("selected");
        document.querySelector('input[name="role"][value="superadmin"]').checked = true;
      }
    }

    function toggleNewBranch() {
      const p = document.getElementById("newBranchPanel");
      p.classList.toggle("hidden");
    }

    function showAlert(msg, type) {
      const b = document.getElementById("alertBox");
      b.classList.remove("hidden");
      b.className = "badge p-3 w-full mb-4 text-left " + (type === "error" ? "badge-danger" : "badge-success");
      b.textContent = msg;
    }

    function hideAlert() {
      document.getElementById("alertBox").classList.add("hidden");
    }

    function createAdmin() { if (window._createAdmin) window._createAdmin(); }
    function saveNewBranch() { if (window._saveNewBranch) window._saveNewBranch(); }
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    async function loadBranches(selectId = null) {
      const sel = document.getElementById("branchSelect");
      const { data } = await supabase.from("branches").select("id, name, code").order("name");
      if (data) {
        sel.innerHTML = '<option value="">-- Pilih Cabang --</option>' +
          data.map(b => `<option value="${b.id}">${b.name} (${b.code})</option>`).join("");
        if (selectId) sel.value = selectId;
      }
    }

    window._saveNewBranch = async function () {
      const name = document.getElementById("newBranchName").value.trim();
      const code = document.getElementById("newBranchCode").value.trim().toUpperCase();

      if (!name || !code) { alert("Nama dan kode cabang wajib diisi!"); return; }

      const { data, error } = await supabase.from("branches").insert([{ name, code }]).select().single();
      if (error) { alert("Gagal simpan cabang: " + error.message); return; }

      document.getElementById("newBranchName").value = "";
      document.getElementById("newBranchCode").value = "";
      document.getElementById("newBranchPanel").classList.add("hidden");

      await loadBranches(data.id);
      showAlert(`✅ Cabang "${name}" berhasil dibuat dan dipilih!`, "success");
    };

    window._createAdmin = async function () {
      hideAlert();

      const displayName = document.getElementById("displayName").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const passwordConfirm = document.getElementById("passwordConfirm").value;
      const role = document.querySelector('input[name=role]:checked').value;
      const branchId = document.getElementById("branchSelect").value;

      if (!displayName || !email || !password || !branchId) {
        showAlert("Semua field bertanda bintang wajib diisi!", "error"); return;
      }
      if (password.length < 8) {
        showAlert("Password minimal 8 karakter!", "error"); return;
      }
      if (password !== passwordConfirm) {
        showAlert("Konfirmasi password tidak cocok!", "error"); return;
      }

      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.textContent = "⏳ Memproses...";

      try {
        const { data: currentSession } = await supabase.auth.getSession();
        const superadminRefreshToken = currentSession?.session?.refresh_token;
        const superadminAccessToken = currentSession?.session?.access_token;

        const { data: authData, error: authError } = await supabase.auth.signUp({
          email, password,
          options: { data: { display_name: displayName, role: role } }
        });

        if (authError) {
          if (superadminRefreshToken) {
            await supabase.auth.setSession({ access_token: superadminAccessToken, refresh_token: superadminRefreshToken });
          }
          btn.disabled = false; btn.textContent = "🚀 Daftarkan Akun Admin";
          showAlert("Gagal daftar: " + authError.message, "error"); return;
        }

        const userId = authData.user.id;

        if (superadminRefreshToken) {
          await supabase.auth.setSession({ access_token: superadminAccessToken, refresh_token: superadminRefreshToken });
        }

        const { error: profileErr } = await supabase.from("profiles").insert({
          user_id: userId, role: role, branch_id: branchId, display_name: displayName
        });

        if (profileErr) {
          btn.disabled = false; btn.textContent = "🚀 Daftarkan Akun Admin";
          showAlert("Gagal buat profil: " + profileErr.message, "error"); return;
        }

        document.getElementById("formCard").style.display = "none";
        document.getElementById("successInfo").innerHTML = `
          <div class="text-xs mb-1"><strong>Nama:</strong> ${displayName}</div>
          <div class="text-xs mb-1"><strong>Email:</strong> ${email}</div>
          <div class="text-xs mb-1"><strong>Password:</strong> ${password}</div>
          <div class="text-xs mb-1"><strong>Role:</strong> ${role}</div>
          <div class="text-xs"><strong>Cabang ID:</strong> ${branchId}</div>
        `;
        document.getElementById("successBanner").classList.remove("hidden");

      } catch (err) {
        btn.disabled = false; btn.textContent = "🚀 Daftarkan Akun Admin";
        showAlert("Error: " + err.message, "error");
      }
    };

    loadBranches();
  </script>
</body>

</html>
