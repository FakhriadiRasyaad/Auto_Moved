<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistik Multi-Cabang — Axionix Superadmin</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="stylesheet" href="../assets/css/superadmin.css" />
</head>

<body class="superadmin-page">

  <script>
    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    if (!admin) window.location.href = "../index.html";
    if (admin && admin.role !== "superadmin") window.location.href = "../admin/dashboard.html";
  </script>

  <div class="superadmin-container max-w-xl" style="max-width:960px;">

    <!-- Top Header -->
    <div class="superadmin-top-nav">
      <div>
        <h1 class="superadmin-page-title">Statistik Multi-Cabang 📊</h1>
        <p class="superadmin-subtitle" style="text-align:left; margin:0; font-size:12.5px;">Pantau pendapatan, total sesi, dan guest dari seluruh cabang secara terpusat</p>
      </div>

      <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'" style="border-radius:14px;">
        <span>← Kembali</span>
      </button>
    </div>

    <!-- KPI Summary Row -->
    <div class="stats-row mb-6">
      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Total Sesi All Cabang</span>
          <div class="admin-stat-icon purple">📊</div>
        </div>
        <div class="admin-stat-value" id="totSesi">0</div>
      </div>

      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Total Guest Transaksi</span>
          <div class="admin-stat-icon blue">👥</div>
        </div>
        <div class="admin-stat-value" id="totGuest">0</div>
      </div>

      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Pendapatan Terverifikasi</span>
          <div class="admin-stat-icon green">💰</div>
        </div>
        <div class="admin-stat-value text-base font-bold text-success" id="totRevenue" style="font-size:22px; color:#10B981;">Rp 0</div>
      </div>

      <div class="admin-stat-card">
        <div class="stat-card-header">
          <span class="admin-stat-label">Cabang Terdaftar</span>
          <div class="admin-stat-icon yellow">🏪</div>
        </div>
        <div class="admin-stat-value" id="totCabang">0</div>
      </div>
    </div>

    <!-- Filter Strip & Export Actions -->
    <div class="setting-card p-4 mb-6" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; border-radius:22px; padding:18px;">
      <div class="filter-strip" style="padding:0; background:none; border:none; margin:0; gap:8px;">
        <button class="filter-btn active" id="filter_all" onclick="setPresetFilter('all')">Semua Hari</button>
        <button class="filter-btn" id="filter_today" onclick="setPresetFilter('today')">Hari Ini</button>
        <button class="filter-btn" id="filter_week" onclick="setPresetFilter('week')">7 Hari</button>
        <button class="filter-btn" id="filter_month" onclick="setPresetFilter('month')">30 Hari</button>
      </div>

      <div style="display:flex; gap:10px;">
        <button class="btn btn-outline btn-xs" onclick="downloadAllCSV()" style="border-radius:12px; font-weight:700;">⬇ Download CSV Sesi</button>
        <button class="btn btn-primary btn-xs" onclick="downloadSummaryCSV()" style="border-radius:12px; font-weight:800; box-shadow:0 6px 16px rgba(255, 51, 133, 0.35);">📊 Export Ringkasan</button>
      </div>
    </div>

    <!-- Branch Accordions Section -->
    <div class="text-xs font-bold text-secondary uppercase tracking-wider mb-3" style="font-size:11px; letter-spacing:1px; color:#8C7B99; margin-bottom:12px;">Breakdown Per Cabang</div>
    <div id="accordionList" class="flex flex-col gap-3">
      <p class="text-xs text-tertiary">Loading statistik cabang...</p>
    </div>

  </div>

  <script>
    let allData = [];
    let currentFilter = "all";
    let customStart = null;
    let customEnd = null;

    function fmtRp(n) {
      if (!n) return "Rp 0";
      if (n >= 1e6) return "Rp " + (n / 1e6).toFixed(1) + "M";
      if (n >= 1e3) return "Rp " + (n / 1e3).toFixed(0) + "k";
      return "Rp " + n;
    }
    function fmtRpFull(n) {
      return "Rp " + (n || 0).toLocaleString("id-ID");
    }

    function setPresetFilter(mode) {
      currentFilter = mode;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      const btn = document.getElementById("filter_" + mode);
      if (btn) btn.classList.add("active");
      renderAll();
    }

    function toggleAcc(branchId) {
      const body = document.getElementById("body_" + branchId);
      const chev = document.getElementById("chev_" + branchId);
      if (body) {
        const isOpen = body.classList.contains("open");
        body.classList.toggle("open", !isOpen);
        if (chev) chev.classList.toggle("open", !isOpen);
      }
    }

    function filterSessions(sessions) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      return (sessions || []).filter(s => {
        const d = new Date(s.created_at);
        if (currentFilter === "today") return d >= today;
        if (currentFilter === "week") return d >= new Date(today.getTime() - 6 * 86400000);
        if (currentFilter === "month") return d >= new Date(today.getTime() - 29 * 86400000);
        return true;
      });
    }

    function computeStats(sessions) {
      const filtered = filterSessions(sessions);
      const paid = filtered.filter(s => s.status === "paid" || s.status === "done");
      const waiting = filtered.filter(s => s.status === "waiting").length;
      const revenue = paid.reduce((a, s) => a + (s.harga || 0), 0);
      return { filtered, paid, waiting, revenue };
    }

    function renderAll() {
      let totRev = 0, totSess = 0;
      const allGuests = new Set();

      allData.forEach(b => {
        const s = computeStats(b.sessions);
        totRev += s.revenue;
        totSess += s.filtered.length;
        b.sessions.forEach(x => { if (x.guest_id) allGuests.add(x.guest_id); });
      });

      document.getElementById("totRevenue").textContent = fmtRpFull(totRev);
      document.getElementById("totSesi").textContent = totSess;
      document.getElementById("totGuest").textContent = allGuests.size;
      document.getElementById("totCabang").textContent = allData.length;

      const listEl = document.getElementById("accordionList");
      if (!allData.length) {
        listEl.innerHTML = `<div class="empty-state" style="padding:32px; text-align:center;"><div class="empty-state-title" style="font-weight:800; color:#261B2E;">Belum ada cabang terdaftar</div></div>`;
        return;
      }

      listEl.innerHTML = allData.map(b => {
        const s = computeStats(b.sessions);
        const uniqueGuests = new Set(b.sessions.map(x => x.guest_id).filter(Boolean)).size;
        const adminsStr = b.profiles.map(p => p.display_name || "Admin").join(", ") || "Belum ada admin";

        return `
        <div class="admin-section" style="border-radius:20px; margin-bottom:14px;">
          <div class="admin-section-header" onclick="toggleAcc('${b.branch.id}')" style="padding:18px 24px;">
            <div class="admin-section-title" style="gap:10px;">
              <span style="font-weight:800; color:#261B2E;">🏪 ${b.branch.name} (${b.branch.code})</span>
              <span class="caption ml-2" style="font-size:12px; color:#8C7B99; font-weight:600;">👤 ${adminsStr}</span>
            </div>
            <div class="admin-section-right" style="gap:10px;">
              <span class="badge badge-success" style="font-weight:800; font-size:12px; padding:4px 12px; border-radius:12px;">${fmtRp(s.revenue)}</span>
              <span class="badge badge-neutral" style="font-weight:700; font-size:12px; padding:4px 10px; border-radius:12px;">${s.filtered.length} sesi</span>
              <span class="chevron" id="chev_${b.branch.id}">▼</span>
            </div>
          </div>

          <div class="admin-section-body" id="body_${b.branch.id}">
            <div class="admin-section-inner" style="padding:20px 24px;">
              <div class="grid mb-4" style="display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;">
                <div class="card p-3" style="background:#FAF7FC; border:1px solid #F0E6F4; border-radius:16px; padding:12px;">
                  <div class="text-xs text-secondary" style="font-size:11.5px; color:#7C6E87; font-weight:600;">Pendapatan</div>
                  <div class="text-sm font-bold text-success" style="font-weight:800; color:#10B981; font-size:15px; margin-top:2px;">${fmtRpFull(s.revenue)}</div>
                </div>
                <div class="card p-3" style="background:#FAF7FC; border:1px solid #F0E6F4; border-radius:16px; padding:12px;">
                  <div class="text-xs text-secondary" style="font-size:11.5px; color:#7C6E87; font-weight:600;">Total Guest</div>
                  <div class="text-sm font-bold" style="font-weight:800; color:#261B2E; font-size:15px; margin-top:2px;">${uniqueGuests}</div>
                </div>
                <div class="card p-3" style="background:#FAF7FC; border:1px solid #F0E6F4; border-radius:16px; padding:12px;">
                  <div class="text-xs text-secondary" style="font-size:11.5px; color:#7C6E87; font-weight:600;">Sesi Lunas</div>
                  <div class="text-sm font-bold" style="font-weight:800; color:#261B2E; font-size:15px; margin-top:2px;">${s.paid.length}</div>
                </div>
                <div class="card p-3" style="background:#FAF7FC; border:1px solid #F0E6F4; border-radius:16px; padding:12px;">
                  <div class="text-xs text-secondary" style="font-size:11.5px; color:#7C6E87; font-weight:600;">Menunggu</div>
                  <div class="text-sm font-bold text-warning" style="font-weight:800; color:#D97706; font-size:15px; margin-top:2px;">${s.waiting}</div>
                </div>
              </div>

              <div style="display:flex; justify-content:flex-end;">
                <button class="btn btn-outline btn-xs" style="border-radius:10px; font-weight:700;" onclick="downloadBranchCSV('${b.branch.id}', '${b.branch.name}')">⬇ CSV ${b.branch.name}</button>
              </div>
            </div>
          </div>
        </div>`;
      }).join("");
    }

    function toCSV(rows, headers) {
      const escape = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
      return [
        headers.map(escape).join(","),
        ...rows.map(r => headers.map(h => escape(r[h])).join(","))
      ].join("\n");
    }

    function downloadCSV(content, filename) {
      const blob = new Blob(["\uFEFF" + content], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
    }

    function downloadBranchCSV(branchId, branchName) {
      const b = allData.find(x => x.branch.id === branchId);
      if (!b) return;
      const filtered = filterSessions(b.sessions);
      const rows = filtered.map(s => ({
        Tanggal: new Date(s.created_at).toLocaleString("id-ID"),
        Paket: s.paket || "",
        Harga: s.harga || 0,
        Pembayaran: s.pembayaran || "",
        Status: s.status || "",
        Cabang: branchName,
      }));
      downloadCSV(toCSV(rows, ["Tanggal", "Paket", "Harga", "Pembayaran", "Status", "Cabang"]),
        `statistik_${branchName.replace(/\s+/g, "_")}_${new Date().toISOString().slice(0, 10)}.csv`);
    }

    function downloadAllCSV() {
      const rows = [];
      allData.forEach(b => {
        filterSessions(b.sessions).forEach(s => {
          rows.push({
            Cabang: b.branch.name,
            Kode: b.branch.code,
            Tanggal: new Date(s.created_at).toLocaleString("id-ID"),
            Paket: s.paket || "",
            Harga: s.harga || 0,
            Pembayaran: s.pembayaran || "",
            Status: s.status || "",
          });
        });
      });
      if (!rows.length) { alert("Tidak ada data untuk diexport."); return; }
      downloadCSV(toCSV(rows, ["Cabang", "Kode", "Tanggal", "Paket", "Harga", "Pembayaran", "Status"]),
        `statistik_semua_${new Date().toISOString().slice(0, 10)}.csv`);
    }

    function downloadSummaryCSV() {
      const rows = allData.map(b => {
        const s = computeStats(b.sessions);
        const uniqueGuests = new Set(b.sessions.map(x => x.guest_id).filter(Boolean)).size;
        return {
          Cabang: b.branch.name,
          Kode: b.branch.code,
          Admin: b.profiles.map(p => p.display_name || "").join("; "),
          "Total Sesi": s.filtered.length,
          "Sesi Lunas": s.paid.length,
          "Menunggu": s.waiting,
          "Total Guest": uniqueGuests,
          "Pendapatan": s.revenue,
        };
      });
      downloadCSV(toCSV(rows, ["Cabang", "Kode", "Admin", "Total Sesi", "Sesi Lunas", "Menunggu", "Total Guest", "Pendapatan"]),
        `ringkasan_cabang_${new Date().toISOString().slice(0, 10)}.csv`);
    }
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    async function loadAll() {
      const { data: branches } = await supabase.from("branches").select("id, code, name").order("name");

      if (!branches?.length) {
        document.getElementById("accordionList").innerHTML = '<div class="empty-state" style="padding:32px; text-align:center;"><div class="empty-state-title" style="font-weight:800; color:#261B2E;">Tidak ada cabang ditemukan.</div></div>';
        return;
      }

      const { data: sessions } = await supabase
        .from("sessions")
        .select("id, branch_id, guest_id, paket, harga, pembayaran, status, created_at")
        .order("created_at", { ascending: false });

      const { data: profiles } = await supabase
        .from("profiles")
        .select("user_id, role, branch_id, display_name")
        .in("role", ["admin", "superadmin"]);

      allData = branches.map(b => ({
        branch: b,
        sessions: (sessions || []).filter(s => s.branch_id === b.id),
        profiles: (profiles || []).filter(p => p.branch_id === b.id),
      }));

      renderAll();
    }

    loadAll();
  </script>
</body>

</html>
