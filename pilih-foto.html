<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Foto — Axionix Photobooth</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="assets/css/design-system.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/customer.css" />

  <style>
    .photo-item {
      position: relative;
      border-radius: var(--radius-lg);
      overflow: hidden;
      aspect-ratio: 4/3;
      background: #18181b;
      cursor: pointer;
      border: 3px solid transparent;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .photo-item:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: var(--color-primary-light);
      box-shadow: var(--shadow-lg);
    }

    .photo-item.selected {
      border-color: var(--color-primary);
      box-shadow: var(--shadow-xl);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>

<body class="customer-page">

  <script>
    if (!localStorage.getItem("currentAdmin") || !localStorage.getItem("currentUser")) {
      window.location.href = "index.html";
    }
  </script>

  <!-- Sparkles -->
  <div class="sparkle sparkle-1"></div>
  <div class="sparkle sparkle-2"></div>

  <div class="customer-container">

    <!-- Top Header -->
    <div class="customer-header">
      <div class="customer-logo">
        <img src="img/Logo_photobooth_LTI.png" alt="Logo Photobooth" />
        <span class="customer-logo-text text-gradient-primary">AXIONIX PHOTOBOOTH</span>
      </div>

      <div class="badge badge-primary p-2 px-4" id="pillSelected">
        Terpilih: <span id="countSelected">0</span> / <span id="countMax">3</span> Foto
      </div>
    </div>

    <!-- Title -->
    <div class="mb-4">
      <h1 class="customer-heading">Pilih Foto Favorit Kamu! 🌟</h1>
      <p class="customer-subheading">Ketuk foto untuk memilih urutan yang akan dimasukkan ke dalam frame photo strip</p>
    </div>

    <!-- Main Photo Selection Grid -->
    <div class="card p-6 flex-1 mb-4" style="background:var(--bg-surface); overflow-y:auto;">
      <div class="grid" style="grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:var(--space-4);"
        id="gridFoto">
        <p class="text-xs text-tertiary">Loading foto...</p>
      </div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="card p-4"
      style="background:var(--bg-surface); display:flex; justify-content:space-between; align-items:center;">
      <div class="flex items-center gap-3">
        <button class="btn btn-outline" onclick="history.back()">← Foto Ulang</button>
        <div class="text-xs font-bold text-secondary">
          Terpilih <span class="text-primary" id="countBottom">0</span> foto
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="flex gap-1" id="selectedThumbs"></div>
        <button class="btn btn-primary btn-xl" id="btnLanjut" onclick="lanjutKeFrame()" disabled>
          <span>Lanjut ke Frame →</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    let user = JSON.parse(localStorage.getItem("currentUser"));
    let pkg = user.paket || { foto_limit: 3 };
    const MAX = pkg.foto_limit >= 999 ? 999 : (pkg.foto_limit || 3);
    let selected = [];

    document.getElementById("countMax").textContent = MAX >= 999 ? "∞" : MAX;

    function renderGrid() {
      const grid = document.getElementById("gridFoto");
      if (!user.foto || !user.foto.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><div class="empty-state-title">Tidak ada foto diambil</div></div>`;
        return;
      }

      grid.innerHTML = user.foto.map((src, idx) => `
        <div class="photo-item" id="item-${idx}" onclick="toggleSelect(${idx}, this)">
          <img src="${src}" alt="Foto ${idx + 1}">
          <div class="photo-badge hidden" id="badge-${idx}"></div>
        </div>
      `).join("");
    }

    function toggleSelect(idx, el) {
      const pos = selected.indexOf(idx);
      if (pos !== -1) {
        selected.splice(pos, 1);
        el.classList.remove("selected");
      } else {
        if (selected.length >= MAX) return;
        selected.push(idx);
        el.classList.add("selected");
      }

      rebuildBadges();
      updateBar();
    }

    function rebuildBadges() {
      document.querySelectorAll(".photo-badge").forEach(b => {
        b.textContent = ""; b.classList.add("hidden");
      });
      selected.forEach((idx, urutan) => {
        const badge = document.getElementById(`badge-${idx}`);
        if (badge) {
          badge.textContent = urutan + 1;
          badge.classList.remove("hidden");
        }
      });
    }

    function updateBar() {
      const cnt = selected.length;
      document.getElementById("countSelected").textContent = cnt;
      document.getElementById("countBottom").textContent = cnt;
      document.getElementById("btnLanjut").disabled = cnt === 0;

      const thumbs = document.getElementById("selectedThumbs");
      thumbs.innerHTML = selected.map(idx => `
        <img src="${user.foto[idx]}" style="width:36px; height:36px; object-fit:cover; border-radius:var(--radius-xs); border:2px solid var(--color-primary);">
      `).join("");
    }

    function lanjutKeFrame() {
      if (selected.length === 0) return;
      user.selectedFoto = selected.map(idx => user.foto[idx]);
      localStorage.setItem("currentUser", JSON.stringify(user));
      window.location.href = "pilih-frame.html";
    }

    user.selectedFoto = [];
    localStorage.setItem("currentUser", JSON.stringify(user));
    renderGrid();
    updateBar();
  </script>
</body>

</html>
