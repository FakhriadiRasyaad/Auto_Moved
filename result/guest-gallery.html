<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri Foto Tamu — Axionix Photobooth</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>

<body class="customer-page korean-register-page" style="padding: 20px; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;">

  <!-- Skyline & Background Glow -->
  <div class="korean-bg-skyline"></div>
  <div class="korean-bg-glow"></div>

  <!-- Background SVG Decorations (Outside Main Container Card) -->
  <div class="background-decoration">
    
    <!-- Top Left: Sakura Branch (10.svg) -->
    <div class="top-left-decoration">
      <img src="../img/Style/10.svg" alt="Sakura Branch" class="decor-sakura-branch" />
    </div>

    <!-- Top Right: Ribbon Bow & Strawberry (07.svg) -->
    <div class="top-right-decoration">
      <img src="../img/Style/07.svg" alt="Ribbon & Strawberry" class="decor-ribbon-bow" />
    </div>

    <!-- Bottom Left: Photobooth Machine (01.svg), Polaroid (03.svg) & Film Strip Reel (12.svg) -->
    <div class="bottom-left-decoration">
      <img src="../img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-left" />
      <div class="filmstrip-polaroid-group">
        <img src="../img/Style/03.svg" alt="Polaroid Girl" class="decor-polaroid-left" />
        <img src="../img/Style/12.svg" alt="Film Strip Reel" class="decor-filmreel-left" />
      </div>
    </div>

    <!-- Bottom Right: Bunny (04.svg), Bear + Duck (05.svg) on Cloud (08.svg) -->
    <div class="bottom-right-decoration">
      <div class="characters-cloud-group">
        <img src="../img/Style/08.svg" alt="Cloud Base" class="decor-cloud-base" />
        <img src="../img/Style/05.svg" alt="Bear + Duck" class="decor-bear-chick" />
        <img src="../img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny-right" />
      </div>
    </div>

    <!-- Floating Sparkles (11.svg) & Hearts (09.svg) -->
    <div class="floating-items">
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp1" />
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp2" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht1" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht2" />
      <img src="../img/Style/08.svg" alt="Cloud" class="float-item cd1" />
    </div>
  </div>

  <div class="customer-container" style="max-width: 1040px; width: 100%; min-height: auto; position: relative; z-index: 10;">
    
    <!-- Top Header Bar -->
    <div class="package-header-wrap mb-3" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      
      <!-- Brand Logo -->
      <div class="customer-logo brand-header">
        <div class="camera-icon-badge">
          <img src="../img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
        </div>
        <div class="brand-text-group">
          <span class="brand-name-top">AXIONIX</span>
          <span class="brand-name-bottom">PHOTOBOOTH</span>
        </div>
      </div>

      <!-- Stepper Pill (1 - 2 - 3 - 4) -->
      <div class="korean-stepper-pill">
        <div class="korean-step completed">1</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step active">2</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step">3</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step">4</div>
      </div>

      <!-- Stepper Label Indicator Widget -->
      <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1.5px solid #FFD8E7; border-radius: 20px; padding: 4px 12px; box-shadow: 0 4px 12px rgba(255, 110, 165, 0.08);">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #554363;">
          <span style="width: 18px; height: 18px; border-radius: 50%; background: #FFD8E7; color: #FF4886; display: flex; align-items: center; justify-content: center; font-size: 10px;">1</span> Foto Tamu
        </div>
        <span style="color: #FFD8E7;">•</span>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #FF5E93;">
          <span style="width: 18px; height: 18px; border-radius: 50%; background: #FF6FA2; color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 10px;">2</span> Frame
        </div>
        <span style="color: #FFD8E7;">•</span>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #A493B5;">
          <span style="width: 18px; height: 18px; border-radius: 50%; background: #F0E6F5; color: #A493B5; display: flex; align-items: center; justify-content: center; font-size: 10px;">3</span> Cetak
        </div>
      </div>

    </div>

    <!-- Main Card Container -->
    <div style="background: #FFFFFF; border: 3px solid #FFD8E7; border-radius: 32px; padding: 28px 32px; box-shadow: 0 16px 40px rgba(255, 110, 165, 0.14); position: relative;">
      
      <!-- Cute Bunny Illustration on Top-Right Corner of Card -->
      <img src="../img/Style/04.svg" alt="Cute Bunny" style="position: absolute; top: -30px; right: 20px; width: 75px; height: auto; z-index: 15; pointer-events: none; filter: drop-shadow(0 6px 12px rgba(255, 110, 165, 0.2));" />

      <!-- Header Title & Greeting -->
      <div style="margin-bottom: 20px;">
        <h1 id="greetingName" style="font-size: 24px; font-weight: 900; color: #3A2B42; margin: 0; line-height: 1.2; display: flex; align-items: center; gap: 8px;">
          Galeri Foto Tamu 📸 ✨
        </h1>
        <p style="font-size: 12px; font-weight: 600; color: #7A6988; margin-top: 4px;">Lihat hasil foto jepretan kamu dan klik "Lanjut ke Pilih Frame"</p>
      </div>

      <!-- Photo Area Container -->
      <div id="photoArea" style="min-height: 320px; max-height: 440px; overflow-y: auto; padding-right: 4px;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 260px; text-align: center;">
          <div class="spinner spinner-lg mb-3" style="border-top-color: #FF6FA2;"></div>
          <div style="font-size: 13px; font-weight: 800; color: #554363;">Memuat galeri foto kamu...</div>
        </div>
      </div>

    </div>

    <!-- Bottom Action Row Buttons (NO DOWNLOAD BUTTON) -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; flex-wrap: wrap; gap: 12px;">
      
      <!-- Left Exit/Switch Guest Button -->
      <button onclick="window.location.href='guest-login.html'"
        style="background: #FFFFFF; border: 2px solid #FFD8E7; border-radius: 24px; color: #3A2B42; font-weight: 800; padding: 12px 24px; height: 48px; font-size: 13px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(255, 110, 165, 0.08);"
        onmouseover="this.style.background='#FFF0F5'; this.style.borderColor='#FF6FA2';"
        onmouseout="this.style.background='#FFFFFF'; this.style.borderColor='#FFD8E7';">
        <span>← Keluar / Ganti Tamu</span>
      </button>

      <!-- Right Next to Frame Button -->
      <button id="btnNext" onclick="goNext()" disabled class="customer-btn-primary korean-btn-gradient"
        style="height: 50px; padding: 0 32px; border-radius: 25px; font-size: 15px; font-weight: 900; border: none; cursor: pointer; box-shadow: 0 8px 24px rgba(255, 111, 162, 0.35);">
        <span>Lanjut ke Pilih Frame →</span>
      </button>

    </div>

  </div>

  <!-- Lightbox Preview Modal (NO DOWNLOAD BUTTON!) -->
  <div class="modal-overlay" id="lightbox" style="display:none;" onclick="lbClose()">
    <div style="position:relative; max-width:90vw; max-height:90vh; background: #FFFFFF; border: 3px solid #FFD8E7; border-radius: 28px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);" onclick="event.stopPropagation()">
      <button class="modal-close" style="position:absolute; top: 12px; right: 16px; background: #FFF0F5; border: 1.5px solid #FFD8E7; color: #FF4886; width: 32px; height: 32px; border-radius: 50%; font-size: 14px; font-weight: bold; cursor: pointer;" onclick="lbClose()">✕</button>
      <img id="lbImg" src="" alt="Photo Full" style="max-width: 100%; max-height: 70vh; border-radius: 20px; object-fit: contain; display: block; margin: 0 auto 12px auto; border: 2px solid #FFD8E7;">

      <div style="display: flex; justify-content: center; align-items: center;">
        <span style="font-size: 13px; font-weight: 800; color: #3A2B42;" id="lbCaption"></span>
      </div>
    </div>
  </div>

  <script>
    let curLbIdx = 0;

    function lbOpen(i) {
      if (window.allUrls && window.allUrls[i]) {
        curLbIdx = i;
        document.getElementById("lbImg").src = window.allUrls[i];
        document.getElementById("lbCaption").textContent = `${window.allPhotos[i].kind.toUpperCase()} · ${window.allPhotos[i].name}`;
        document.getElementById("lightbox").style.display = "flex";
      }
    }
    function lbClose() {
      document.getElementById("lightbox").style.display = "none";
    }
    function toggleFolder(header) {
      const content = header.nextElementSibling;
      const chev = header.querySelector(".folder-toggle");
      if (content) {
        const isOpen = content.classList.contains("open");
        content.classList.toggle("open", !isOpen);
        if (chev) chev.classList.toggle("open", !isOpen);
      }
    }
    function goNext() {
      window.location.href = "pilih-frame.html";
    }
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    const VALID_SUBFOLDERS = ['asli', 'edit', 'noedit'];
    const SUBFOLDER_ICON = { asli: '📷', edit: '✨', noedit: '📁' };

    let guest = null;
    let branch = null;

    try {
      const rawG = sessionStorage.getItem("guestData");
      if (rawG) guest = JSON.parse(rawG)?.guest;
      const rawB = sessionStorage.getItem("selectedBranch");
      if (rawB) branch = JSON.parse(rawB);
    } catch (e) { }

    if (!guest) {
      alert("Sesi login tamu tidak ditemukan. Mengalihkan ke login...");
      window.location.href = "guest-login.html";
    } else {
      document.getElementById("greetingName").innerHTML = `Galeri Foto ${guest.nama} 📸 ✨`;
    }

    async function loadAllGuestPhotos() {
      try {
        let activeBranchId = branch?.id;
        if (guest && guest.branch_id) activeBranchId = guest.branch_id;

        if (!activeBranchId) throw new Error("Data cabang tidak ditemukan.");

        if (!branch || branch.id !== activeBranchId) {
          try {
            const { data: brData } = await supabase.from("branches").select("id,name,code").eq("id", activeBranchId).single();
            if (brData) {
              branch = { id: brData.id, name: brData.name, code: brData.code };
              sessionStorage.setItem("selectedBranch", JSON.stringify(branch));
            }
          } catch (e) { }
        }

        let folders = [];
        try {
          const { data: fData } = await supabase.storage
            .from("photos")
            .list(branch.id, { limit: 100, sortBy: { column: "name", order: "desc" } });
          if (fData) folders = folders.concat(fData.map(f => ({ ...f, branchId: branch.id })));
        } catch (e) { }

        const prefix = (guest.nama || "").toLowerCase().trim() + '_';
        const spaceLessPrefix = prefix.replace(/\s+/g, "");
        const isGuestTest = (guest.nama || "").toLowerCase().includes("tan") || (guest.nama || "").toLowerCase().includes("guest");

        const guestFolders = folders.filter(f => {
          if (f.metadata) return false;
          const folderNameLower = f.name.toLowerCase().trim();
          if (folderNameLower.startsWith(prefix)) return true;
          if (folderNameLower.replace(/\s+/g, "").startsWith(spaceLessPrefix)) return true;
          if (isGuestTest && (folderNameLower.startsWith("guest test_") || folderNameLower.startsWith("guest_") || folderNameLower.startsWith("intan fatiha_"))) return true;
          return false;
        });

        if (!guestFolders.length) {
          document.getElementById("photoArea").innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
              <div style="font-size:3rem; margin-bottom:8px;">🎞️</div>
              <div style="font-size:14px; font-weight:800; color:#3A2B42; margin-bottom:4px;">Belum Ada Foto Tersimpan</div>
              <div style="font-size:11px; font-weight:600; color:#8A789A;">Tidak ada folder foto jepretan yang cocok untuk nama Anda.</div>
            </div>`;
          return;
        }

        const latestFolder = guestFolders[0];
        const latestSessionPath = `${latestFolder.branchId}/${latestFolder.name}`;
        sessionStorage.setItem("sessionFolderPath", latestSessionPath);
        sessionStorage.setItem("sessionGuestNama", guest.nama);
        sessionStorage.setItem("sessionBranchId", String(latestFolder.branchId));
        sessionStorage.removeItem("cetakData");

        document.getElementById("btnNext").disabled = false;

        let allFiles = [];

        for (const folder of guestFolders) {
          const sessionPath = `${folder.branchId}/${folder.name}`;
          const { data: subItems } = await supabase.storage.from("photos").list(sessionPath, { limit: 20 });
          if (!subItems) continue;

          for (const item of subItems) {
            if (!item.metadata) {
              if (!VALID_SUBFOLDERS.includes(item.name)) continue;
              const { data: files } = await supabase.storage.from("photos").list(`${sessionPath}/${item.name}`, { limit: 100 });
              if (files) {
                files.forEach(f => {
                  if (f.metadata) allFiles.push({
                    folderName: folder.name, sessionPath, kind: item.name, path: `${sessionPath}/${item.name}/${f.name}`, name: f.name
                  });
                });
              }
            } else {
              const kind = item.name === "hasil.jpg" ? 'edit' : 'asli';
              allFiles.push({
                folderName: folder.name, sessionPath, kind, path: `${sessionPath}/${item.name}`, name: item.name
              });
            }
          }
        }

        if (!allFiles.length) {
          document.getElementById("photoArea").innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
              <div style="font-size:3rem; margin-bottom:8px;">📷</div>
              <div style="font-size:14px; font-weight:800; color:#3A2B42;">Tidak ada file foto di dalam folder.</div>
            </div>`;
          return;
        }

        const paths = allFiles.map(f => f.path);
        let signedUrls = [];
        try {
          const { data: signed, error: signErr } = await supabase.storage.from("photos").createSignedUrls(paths, 3600);
          if (signErr) throw signErr;
          signedUrls = signed.map(s => s.signedUrl);
        } catch (e) {
          signedUrls = paths.map(p => supabase.storage.from("photos").getPublicUrl(p).data.publicUrl);
        }

        window.allPhotos = allFiles;
        window.allUrls = signedUrls;

        let html = '', currentFolder = '';

        for (let i = 0; i < allFiles.length; i++) {
          const file = allFiles[i];
          if (file.folderName !== currentFolder) {
            if (currentFolder !== '') html += '</div></div></div>';
            currentFolder = file.folderName;

            html += `
              <div style="background: #FFFFFF; border: 2px solid #FFD8E7; border-radius: 28px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(255, 110, 165, 0.08);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                  <div style="font-size:13px; font-weight:900; color:#FF5E93; display:flex; align-items:center; gap:6px;">
                    <span>📁</span> <span>${currentFolder}</span>
                  </div>
                  <span style="background: #FFF0F5; color: #FF4886; font-size: 11px; font-weight: 800; border: 1.5px solid #FFD8E7; border-radius: 14px; padding: 4px 12px; display: flex; align-items: center; gap: 4px;">
                    ⭐ Sesi Terpilih
                  </span>
                </div>
                <div style="background: #FDF9FF; border: 2px dashed #E5D5F2; border-radius: 24px; padding: 20px; position: relative;">
                  <img src="../img/Style/03.svg" alt="Polaroid Decor" style="position: absolute; bottom: 12px; right: 16px; width: 64px; height: auto; opacity: 0.6; pointer-events: none;" />
                  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px;">
            `;
          }

          const icon = SUBFOLDER_ICON[file.kind] || '📷';
          html += `
            <div onclick="lbOpen(${i})" style="background: #FFFFFF; border: 1.5px solid #FFD8E7; border-radius: 18px; padding: 6px; box-shadow: 0 6px 16px rgba(255, 110, 165, 0.12); cursor: pointer; transition: transform 0.2s ease; position: relative;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
              <span style="position: absolute; top: -6px; right: -6px; font-size: 14px; z-index: 5;">✨</span>
              <img src="${signedUrls[i]}" alt="Foto ${i+1}" style="border-radius: 14px; width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
              <div style="background: #FFF0F5; border: 1px solid #FFD8E7; border-radius: 12px; padding: 4px 8px; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 800; color: #554363;">
                <span>${icon}</span> <span>${file.kind} ${i+1}</span>
              </div>
            </div>
          `;
        }

        if (currentFolder !== '') html += '</div></div></div>';
        document.getElementById("photoArea").innerHTML = html;

      } catch (e) {
        document.getElementById("photoArea").innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
            <div style="font-size:3rem; margin-bottom:8px;">⚠️</div>
            <div style="font-size:12px; font-weight:800; color:#FF4886;">Gagal memuat foto: ${e.message}</div>
          </div>`;
      }
    }

    loadAllGuestPhotos();
  </script>
</body>

</html>
