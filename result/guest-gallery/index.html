<body class="customer-page korean-register-page" style="padding: 20px; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;">

  <!-- Skyline & Background Glow -->

  <div class="korean-bg-glow"></div>

  <!-- Background SVG Decorations (Outside Main Container Card) -->

    <!-- Top Left: Sakura Branch (10.svg) -->

      <img src="../../img/Style/10.svg" alt="Sakura Branch" class="decor-sakura-branch" />

    <!-- Top Right: Ribbon Bow & Strawberry (07.svg) -->

      <img src="../../img/Style/07.svg" alt="Ribbon & Strawberry" class="decor-ribbon-bow" />

    <!-- Bottom Left: Photobooth Machine (01.svg), Polaroid (03.svg) & Film Strip Reel (12.svg) -->

      <img src="../../img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-left" />

        <img src="../../img/Style/12.svg" alt="Film Strip Reel" class="decor-filmreel-left" />
      </div>
    </div>

    <!-- Bottom Right: Bunny (04.svg), Bear + Duck (05.svg) on Cloud (08.svg) -->

      <div class="characters-cloud-group">
        <img src="../../img/Style/08.svg" alt="Cloud Base" class="decor-cloud-base" />
        <img src="../../img/Style/05.svg" alt="Bear + Duck" class="decor-bear-chick" />
        <img src="../../img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny-right" />

    <!-- Floating Sparkles (11.svg) & Hearts (09.svg) -->
    <div class="floating-items">
      <img src="../../img/Style/11.svg" alt="Sparkle" class="float-item sp1" />
      <img src="../../img/Style/11.svg" alt="Sparkle" class="float-item sp2" />
      <img src="../../img/Style/09.svg" alt="Heart" class="float-item ht1" />
      <img src="../../img/Style/09.svg" alt="Heart" class="float-item ht2" />
      <img src="../../img/Style/08.svg" alt="Cloud" class="float-item cd1" />
    </div>
  </div>

  <div class="customer-container" style="max-width: 1040px; width: 100%; min-height: auto; position: relative; z-index: 10;">
    
    <!-- Top Header Bar -->
    <div class="package-header-wrap mb-3" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
      
      <!-- Brand Logo -->
      <div class="customer-logo brand-header">
        <div class="camera-icon-badge">
          <img src="../../img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
        </div>
        <div class="brand-text-group">
          <span class="brand-name-top">AXIONIX</span>
          <span class="brand-name-bottom">PHOTO 🦾 </span>
        </div>
      </div>

      <!-- Stepper Pill (1 - 2 - 3 - 4) -->
      <div class="korean-stepper-pill">
        <div class="korean-step completed">1</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step active">2</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step">3</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step">4</div>
      </div>

      <!-- Stepper Label Indicator Widget -->
      <div style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1.5px solid #FFD8E7; border-radius: 20px; padding: 4px 12px; box-shadow: 0 4px 12px rgba(255, 110, 165, 0.08);">
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #554363;">
          <span style="width: 18px; height: 18px; border-radius: 50%; background: #FFD8E7; color: #FF4886; display: flex; align-items: center; justify-content: center; font-size: 10px;">1</span> Foto Tamu
        </div>
        <span style="color: #FFD8E7;">•</span>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #FF5E93;">
          <span style="width: 18px; height: 18px; border-radius: 50%; background: #FF6FA2; color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 10px;">2</span> Frame
        </div>
        <span style="color: #FFD8E7;">•</span>
        <div style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #A493B5;">
          <span style="width: 18px; height: 18px; border-radius: 50%; background: #F0E6F5; color: #A493B5; display: flex; align-items: center; justify-content: center; font-size: 10px;">3</span> Cetak
        </div>

    </div>

    <!-- Main Card Container -->
    <div style="background: #FFFFFF; border: 3px solid #FFD8E7; border-radius: 32px; padding: 28px 32px; box-shadow: 0 16px 40px rgba(255, 110, 165, 0.14); position: relative;">
      
      <!-- Cute Bunny Illustration on Top-Right Corner of Card -->
      <img src="../../img/Style/04.svg" alt="Cute Bunny" style="position: absolute; top: -30px; right: 20px; width: 75px; height: auto; z-index: 15; pointer-events: none; filter: drop-shadow(0 6px 12px rgba(255, 110, 165, 0.2));" />

      <!-- Header Title & Greeting -->
      <div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 id="greetingName" style="font-size: 24px; font-weight: 900; color: #3A2B42; margin: 0; line-height: 1.2; display: flex; align-items: center; gap: 8px;">
            Galeri Foto Tamu 📸 ✨
          </h1>
          <p style="font-size: 12px; font-weight: 600; color: #7A6988; margin-top: 4px;">Pilih maksimal 10 foto jepretan terbaik kamu untuk dicetak ke frame!</p>
        </div>
        <div id="selectCountBadge" style="background: #FFEBF2; color: #FF4886; border: 2px solid #FFD8E7; border-radius: 20px; padding: 8px 18px; font-size: 13px; font-weight: 900; box-shadow: 0 4px 12px rgba(255, 110, 165, 0.12);">
          0 / 10 Terpilih
        </div>
      </div>

      <!-- Photo Area Container -->
      <div id="photoArea" style="min-height: 320px; max-height: 440px; overflow-y: auto; padding-right: 4px;">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 260px; text-align: center;">
          <div class="spinner spinner-lg mb-3" style="border-top-color: #FF6FA2;"></div>
          <div style="font-size: 13px; font-weight: 800; color: #554363;">Memuat galeri foto kamu...</div>
        </div>

    </div>

    <!-- Bottom Action Row Buttons -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; flex-wrap: wrap; gap: 12px;">
      
      <!-- Left Exit/Switch Guest Button -->
      <button onclick="window.location.href='../guest-login/'"
        style="background: #FFFFFF; border: 2px solid #FFD8E7; border-radius: 24px; color: #3A2B42; font-weight: 800; padding: 12px 24px; height: 48px; font-size: 13px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(255, 110, 165, 0.08);"
        onmouseover="this.style.background='#FFF0F5'; this.style.borderColor='#FF6FA2';"
        onmouseout="this.style.background='#FFFFFF'; this.style.borderColor='#FFD8E7';">
        <span>← Keluar / Ganti Tamu</span>
      </button>

      <!-- Right Continue Button -->
      <button id="btnContinue" onclick="proceedToFrame()" class="customer-btn-primary korean-btn-gradient"
        style="height: 48px; border-radius: 24px; font-size: 14px; font-weight: 900; padding: 0 28px; display: flex; align-items: center; gap: 8px; border: none; cursor: pointer; box-shadow: 0 8px 24px rgba(255, 111, 162, 0.35);">
        <span>Lanjut Pilih Frame →</span>
      </button>

    </div>

  </div>

  <!-- Lightbox Modal Preview -->
  <div id="lbModal" onclick="lbClose()" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 999; align-items: center; justify-content: center; padding: 20px;">
    <div onclick="event.stopPropagation()" style="position: relative; max-width: 90vw; max-height: 90vh; display: flex; flex-direction: column; align-items: center;">
      <img id="lbImg" src="" alt="Preview" style="max-width: 100%; max-height: 80vh; border-radius: 16px; object-fit: contain; box-shadow: 0 20px 40px rgba(0,0,0,0.5);">
      <div style="margin-top: 14px; display: flex; gap: 12px; align-items: center;">
        <button id="lbSelectBtn" onclick="lbToggleSelect()" style="background: #FF6FA2; color: #FFF; border: none; border-radius: 20px; padding: 8px 20px; font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: 0 4px 14px rgba(255,111,162,0.4);">
          Pilih Foto Ini
        </button>
        <button onclick="lbClose()" style="background: rgba(255,255,255,0.2); color: #FFF; border: 1px solid rgba(255,255,255,0.4); border-radius: 20px; padding: 8px 18px; font-weight: 800; font-size: 13px; cursor: pointer;">
          Tutup
        </button>
      </div>
    </div>
  </div>

  <script>
    const selectedPhotoIndices = new Set();
    let currentLbIndex = null;

    function togglePhotoSelect(idx, e) {
      if (e) e.stopPropagation();
      if (selectedPhotoIndices.has(idx)) {
        selectedPhotoIndices.delete(idx);
      } else {
        if (selectedPhotoIndices.size >= 10) {
          alert("Maksimal 10 foto yang dapat dipilih!");
          return;
        }
        selectedPhotoIndices.add(idx);
      }
      updateSelectUI();
    }

    function updateSelectUI() {
      const count = selectedPhotoIndices.size;
      const badge = document.getElementById("selectCountBadge");
      if (badge) badge.textContent = `${count} / 10 Terpilih`;

      if (window.allPhotos) {
        for (let i = 0; i < window.allPhotos.length; i++) {
          const card = document.getElementById(`photoCard-${i}`);
          const chk = document.getElementById(`photoChk-${i}`);
          const isSel = selectedPhotoIndices.has(i);
          if (card) {
            card.style.border = isSel ? '2.5px solid #FF4886' : '1.5px solid #FFD8E7';
            card.style.boxShadow = isSel ? '0 8px 20px rgba(255, 72, 134, 0.28)' : '0 6px 16px rgba(255, 110, 165, 0.12)';
          }
          if (chk) {
            chk.style.background = isSel ? '#FF4886' : 'rgba(255,255,255,0.92)';
            chk.style.borderColor = isSel ? '#FF4886' : '#FFD8E7';
            chk.innerHTML = isSel ? '✓' : '';
          }
        }
      }
    }

    function lbOpen(idx, e) {
      if (e) e.stopPropagation();
      currentLbIndex = idx;
      document.getElementById("lbImg").src = window.allUrls[idx];
      document.getElementById("lbModal").style.display = "flex";
      updateLbBtn();
    }

    function lbClose() {
      document.getElementById("lbModal").style.display = "none";
      currentLbIndex = null;
    }

    function lbToggleSelect() {
      if (currentLbIndex !== null) {
        togglePhotoSelect(currentLbIndex);
        updateLbBtn();
      }
    }

    function updateLbBtn() {
      const btn = document.getElementById("lbSelectBtn");
      if (!btn || currentLbIndex === null) return;
      const isSel = selectedPhotoIndices.has(currentLbIndex);
      btn.textContent = isSel ? "✓ Terpilih (Batal)" : "+ Pilih Foto Ini";
      btn.style.background = isSel ? "#4CAF50" : "#FF6FA2";
    }

    function proceedToFrame() {
      if (selectedPhotoIndices.size === 0) {
        alert("Pilih minimal 1 foto untuk dilanjutkan ke frame!");
        return;
      }
      const selectedIndices = Array.from(selectedPhotoIndices);
      const selectedPhotos = selectedIndices.map(i => window.allPhotos[i]);
      const selectedUrls = selectedIndices.map(i => window.allUrls[i]);
      const selectedPaths = selectedPhotos.map(p => p.path);

      sessionStorage.setItem("guestSelectedPhotos", JSON.stringify(selectedPaths));
      sessionStorage.setItem("guestSelectedUrls", JSON.stringify(selectedUrls));
      sessionStorage.setItem("guestAllPhotos", JSON.stringify(window.allPhotos));

      window.location.href = "../pilih-frame/";
    }
  </script>

  <script type="module">
    import { supabase } from "../../assets/js/supabase.js";

    const VALID_SUBFOLDERS = ['asli', 'edit', 'noedit'];
    const SUBFOLDER_ICON = { asli: '📷', edit: '✨', noedit: '📁' };

    let guest = null;
    let branch = null;

    try {
      const rawG = sessionStorage.getItem("guestData");
      if (rawG) guest = JSON.parse(rawG)?.guest;
      const rawB = sessionStorage.getItem("selectedBranch");
      if (rawB) branch = JSON.parse(rawB);
    } catch (e) { }

    if (!guest) {
      alert("Sesi login tamu tidak ditemukan. Mengalihkan ke login...");
      window.location.href = "../guest-login/";
    } else {
      document.getElementById("greetingName").innerHTML = `Galeri Foto ${guest.nama} 📸 ✨`;
    }

    async function ensureSupabaseSession() {
      try {
        const { data } = await supabase.auth.getSession();
        if (!data?.session) {
          await supabase.auth.signInWithPassword({ email: "lti@gmail.com", password: "12345678" });
        }
      } catch (e) { }
    }

    async function loadAllGuestPhotos() {
      try {
        await ensureSupabaseSession();

        let activeBranchId = guest?.branch_id || branch?.id || "b149999f-33ec-4342-95bb-4f4961956c0b";

        if (!branch || branch.id !== activeBranchId) {
          try {
            const { data: brData } = await supabase.from("branches").select("id,name,code").eq("id", activeBranchId).single();
            if (brData) {
              branch = { id: brData.id, name: brData.name, code: brData.code };
              sessionStorage.setItem("selectedBranch", JSON.stringify(branch));
            }
          } catch (e) { }
        }

        let branchIdsToTry = [...new Set([activeBranchId, "b149999f-33ec-4342-95bb-4f4961956c0b"])];
        try {
          const { data: allBranches } = await supabase.from("branches").select("id,name");
          if (allBranches && allBranches.length) {
            allBranches.forEach(b => {
              if (b.id && !branchIdsToTry.includes(b.id)) branchIdsToTry.push(b.id);
            });
          }
        } catch (e) { }

        let folders = [];
        for (const bId of branchIdsToTry) {
          try {
            const { data: fData } = await supabase.storage
              .from("photos")
              .list(bId, { limit: 100, sortBy: { column: "name", order: "desc" } });
            if (fData && fData.length) {
              const realFolders = fData.filter(f => !f.metadata);
              realFolders.forEach(f => {
                if (!folders.some(exist => exist.name === f.name && exist.branchId === bId)) {
                  folders.push({ ...f, branchId: bId });
                }
              });
            }
          } catch (e) { }
        }

        try {
          const { data: rootData } = await supabase.storage
            .from("photos")
            .list("", { limit: 100, sortBy: { column: "name", order: "desc" } });
          if (rootData && rootData.length) {
            rootData.forEach(f => {
              if (!f.metadata && !branchIdsToTry.includes(f.name)) {
                if (!folders.some(exist => exist.name === f.name)) {
                  folders.push({ ...f, branchId: "" });
                }
              }
            });
          }
        } catch (e) { }

        const guestNameClean = (guest.nama || "").toLowerCase().trim();
        const prefix = guestNameClean + '_';

        let guestFolders = folders.filter(f => {
          if (f.metadata) return false;
          const folderNameLower = f.name.toLowerCase().trim();
          if (folderNameLower.startsWith(prefix)) return true;
          if (folderNameLower.replace(/\s+/g, "").startsWith(prefix.replace(/\s+/g, ""))) return true;
          if (guestNameClean && folderNameLower.includes(guestNameClean)) return true;
          return false;
        });

        if (!guestFolders.length && folders.length > 0) {
          guestFolders = folders.filter(f => !f.metadata);
        }

        if (!guestFolders.length) {
          document.getElementById("photoArea").innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
              <div style="font-size:3rem; margin-bottom:8px;">🎞️</div>
              <div style="font-size:14px; font-weight:800; color:#3A2B42; margin-bottom:4px;">Belum Ada Foto Tersimpan</div>
              <div style="font-size:11px; font-weight:600; color:#8A789A;">Belum ada folder foto jepretan di cabang ini.</div>
            </div>`;
          return;
        }

        const latestFolder = guestFolders[0];
        const latestSessionPath = latestFolder.branchId ? `${latestFolder.branchId}/${latestFolder.name}` : latestFolder.name;
        sessionStorage.setItem("sessionFolderPath", latestSessionPath);
        sessionStorage.setItem("sessionGuestNama", guest.nama);
        sessionStorage.setItem("sessionBranchId", String(latestFolder.branchId || activeBranchId));
        sessionStorage.removeItem("cetakData");

        let allFiles = [];

        for (const folder of guestFolders) {
          const sessionPath = folder.branchId ? `${folder.branchId}/${folder.name}` : folder.name;
          const { data: subItems } = await supabase.storage.from("photos").list(sessionPath, { limit: 50 });
          if (!subItems || !subItems.length) continue;

          for (const item of subItems) {
            if (!item.metadata) {
              const { data: files } = await supabase.storage.from("photos").list(`${sessionPath}/${item.name}`, { limit: 100 });
              if (files) {
                const realFiles = files.filter(f => f.metadata && f.name !== '.DS_Store');
                realFiles.forEach(f => {
                  allFiles.push({
                    folderName: folder.name, sessionPath, kind: item.name, path: `${sessionPath}/${item.name}/${f.name}`, name: f.name
                  });
                });
              }
            } else {
              if (item.name !== '.DS_Store') {
                const kind = item.name === "hasil.jpg" ? 'edit' : 'asli';
                allFiles.push({
                  folderName: folder.name, sessionPath, kind, path: `${sessionPath}/${item.name}`, name: item.name
                });
              }
            }
          }
        }

        if (!allFiles.length) {
          document.getElementById("photoArea").innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
              <div style="font-size:3rem; margin-bottom:8px;">📷</div>
              <div style="font-size:14px; font-weight:800; color:#3A2B42;">Tidak ada file foto di dalam folder.</div>
            </div>`;
          return;
        }

        const paths = allFiles.map(f => f.path);
        let signedUrls = [];
        try {
          const { data: signed, error: signErr } = await supabase.storage.from("photos").createSignedUrls(paths, 3600);
          if (signErr) throw signErr;
          signedUrls = signed.map(s => s.signedUrl);
        } catch (e) {
          signedUrls = paths.map(p => supabase.storage.from("photos").getPublicUrl(p).data.publicUrl);
        }

        window.allPhotos = allFiles;
        window.allUrls = signedUrls;

        selectedPhotoIndices.clear();
        for (let i = 0; i < Math.min(10, allFiles.length); i++) {
          selectedPhotoIndices.add(i);
        }

        let html = '', currentFolder = '';

        for (let i = 0; i < allFiles.length; i++) {
          const file = allFiles[i];
          if (file.folderName !== currentFolder) {
            if (currentFolder !== '') html += '</div></div></div>';
            currentFolder = file.folderName;

            html += `
              <div style="background: #FFFFFF; border: 2px solid #FFD8E7; border-radius: 28px; padding: 20px 24px; margin-bottom: 20px; box-shadow: 0 8px 24px rgba(255, 110, 165, 0.08);">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                  <div style="font-size:13px; font-weight:900; color:#FF5E93; display:flex; align-items:center; gap:6px;">
                    <span>📁</span> <span>${currentFolder}</span>
                  </div>
                  <span style="background: #FFF0F5; color: #FF4886; font-size: 11px; font-weight: 800; border: 1.5px solid #FFD8E7; border-radius: 14px; padding: 4px 12px; display: flex; align-items: center; gap: 4px;">
                    ⭐ Sesi Terpilih
                  </span>
                </div>
                <div style="background: #FDF9FF; border: 2px dashed #E5D5F2; border-radius: 24px; padding: 20px; position: relative;">
                  <img src="../../img/Style/03.svg" alt="Polaroid Decor" style="position: absolute; bottom: 12px; right: 16px; width: 64px; height: auto; opacity: 0.6; pointer-events: none;" />
                  <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px;">
            `;
          }

          const icon = SUBFOLDER_ICON[file.kind] || '📷';
          const isSelected = selectedPhotoIndices.has(i);

          html += `
            <div id="photoCard-${i}" onclick="togglePhotoSelect(${i}, event)" style="background: #FFFFFF; border: ${isSelected ? '2.5px solid #FF4886' : '1.5px solid #FFD8E7'}; border-radius: 18px; padding: 6px; box-shadow: ${isSelected ? '0 8px 20px rgba(255, 72, 134, 0.28)' : '0 6px 16px rgba(255, 110, 165, 0.12)'}; cursor: pointer; transition: all 0.2s ease; position: relative;" onmouseover="this.style.transform='scale(1.03)'" onmouseout="this.style.transform='scale(1)'">
              
              <!-- Checkbox Toggle -->
              <div id="photoChk-${i}" onclick="togglePhotoSelect(${i}, event)" title="Pilih foto ini" style="position: absolute; top: 10px; right: 10px; width: 26px; height: 26px; border-radius: 50%; background: ${isSelected ? '#FF4886' : 'rgba(255,255,255,0.92)'}; border: 2px solid ${isSelected ? '#FF4886' : '#FFD8E7'}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 900; font-size: 13px; z-index: 10; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.18);">
                ${isSelected ? '✓' : ''}
              </div>

              <img src="${signedUrls[i]}" alt="Foto ${i+1}" style="border-radius: 14px; width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block;">
              
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px; gap: 4px;">
                <div style="flex: 1; background: #FFF0F5; border: 1px solid #FFD8E7; border-radius: 12px; padding: 4px 6px; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 800; color: #554363;">
                  <span>${icon}</span> <span>${file.kind} ${i+1}</span>
                </div>
                <button onclick="lbOpen(${i}, event)" title="Preview Besar" style="background: #FFFFFF; border: 1px solid #FFD8E7; border-radius: 12px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; color: #FF5E93;">🔍</button>
              </div>
            </div>
          `;
        }

        if (currentFolder !== '') html += '</div></div></div>';
        document.getElementById("photoArea").innerHTML = html;
        updateSelectUI();

      } catch (e) {
        document.getElementById("photoArea").innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
            <div style="font-size:3rem; margin-bottom:8px;">⚠️</div>
            <div style="font-size:12px; font-weight:800; color:#FF4886;">Gagal memuat foto: ${e.message}</div>
          </div>`;
      }
    }

    loadAllGuestPhotos();
  </script>
</body>

</html>
