<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terima Kasih — Axionix Photobooth</title>

  <!-- Favicon / Logo -->
  <link rel="icon" type="image/png" href="../../img/Logo_photobooth_LTI.png" />

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../../assets/css/design-system.css" />
  <link rel="stylesheet" href="../../assets/css/components.css" />
  <link rel="stylesheet" href="../../assets/css/customer.css" />

  <script>
    if (window.location.pathname.endsWith('/index.html')) {
      window.history.replaceState(null, '', window.location.pathname.replace(/\/index\.html$/, '/') + window.location.search);
    }
  </script>

  <style>
    @media (max-width: 576px) {
      body.customer-page {
        padding: 16px !important;
      }

      .thankyou-container {
        padding: 24px 18px !important;
        border-radius: 24px !important;
      }

      .thankyou-icon {
        font-size: 54px !important;
      }

      .thankyou-heading {
        font-size: 24px !important;
      }
    }
  </style>
</head>

<body class="customer-page">

  <!-- Sparkles -->
  <div class="sparkle sparkle-1"></div>
  <div class="sparkle sparkle-2"></div>
  <div class="sparkle sparkle-3"></div>
  <div class="sparkle sparkle-4"></div>

  <div class="thankyou-container customer-card max-w-md w-full">
    <div class="customer-logo mb-2">
      <img src="../../img/Logo_photobooth_LTI.png" alt="Logo Photobooth" />
      <span class="customer-logo-text text-gradient-primary">AXIONIX PHOTOBOOTH</span>
    </div>

    <div class="thankyou-icon">🖼️</div>

    <h1 class="thankyou-heading">Terima Kasih!</h1>

    <p class="font-bold text-lg text-primary">Hasil cetakan kamu telah selesai! ✨</p>

    <p class="thankyou-subtext text-sm">
      Silakan ambil foto fisik kamu di baki / konter mesin cetak. Semoga momen ini menjadi kenangan indah! ❤️
    </p>

    <!-- Progress bar countdown -->
    <div style="width: 100%; margin-top: var(--space-4);">
      <div class="progress-bar" style="height: 8px;">
        <div class="progress-bar-fill" id="progressFill" style="width: 100%;"></div>
      </div>
      <div class="thankyou-countdown">Kembali ke layar login dalam beberapa detik...</div>
    </div>
  </div>

  <script>
    sessionStorage.clear();

    let timeLeft = 15;
    const progressFill = document.getElementById("progressFill");

    const timer = setInterval(() => {
      timeLeft--;
      const percentage = (timeLeft / 15) * 100;
      progressFill.style.width = `${percentage}%`;

      if (timeLeft <= 0) {
        clearInterval(timer);
        window.location.href = "../guest-login/";
      }
    }, 1000);

    progressFill.style.width = "100%";
  </script>
</body>

</html>
