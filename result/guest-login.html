<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Tamu — Axionix Photobooth</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />

  <style>
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body class="customer-page korean-register-page"
  style="padding: 24px; min-height: 100vh; overflow-x: hidden; display: flex; align-items: center; justify-content: center;">

  <!-- Skyline & Background Glow -->
  <div class="korean-bg-skyline"></div>
  <div class="korean-bg-glow"></div>

  <!-- Background SVG Decorations (Outside Main Container Card) -->
  <div class="background-decoration">

    <!-- Top Left: Sakura Branch (10.svg) -->
    <div class="top-left-decoration">
      <img src="../img/Style/10.svg" alt="Sakura Branch" class="decor-sakura-branch" />
    </div>

    <!-- Top Right: Ribbon Bow & Strawberry (07.svg) -->
    <div class="top-right-decoration">
      <img src="../img/Style/07.svg" alt="Ribbon & Strawberry" class="decor-ribbon-bow" />
    </div>

    <!-- Bottom Left: Photobooth Machine (01.svg), Polaroid (03.svg) & Film Strip Reel (12.svg) -->
    <div class="bottom-left-decoration">
      <img src="../img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-left" />
      <div class="filmstrip-polaroid-group">
        <img src="../img/Style/03.svg" alt="Polaroid Girl" class="decor-polaroid-left" />
        <img src="../img/Style/12.svg" alt="Film Strip Reel" class="decor-filmreel-left" />
      </div>
    </div>

    <!-- Bottom Right: Bunny (04.svg), Bear + Duck (05.svg) on Cloud (08.svg) -->
    <div class="bottom-right-decoration">
      <div class="characters-cloud-group">
        <img src="../img/Style/08.svg" alt="Cloud Base" class="decor-cloud-base" />
        <img src="../img/Style/05.svg" alt="Bear + Duck" class="decor-bear-chick" />
        <img src="../img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny-right" />
      </div>
    </div>

    <!-- Floating Sparkles (11.svg) & Hearts (09.svg) -->
    <div class="floating-items">
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp1" />
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp2" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht1" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht2" />
      <img src="../img/Style/08.svg" alt="Cloud" class="float-item cd1" />
    </div>
  </div>

  <!-- Main Korean Pastel Card Container -->
  <div class="customer-container"
    style="max-width: 920px; width: 100%; min-height: auto; position: relative; z-index: 10; background: #FFFFFF; border: 3px solid #FFD8E7; border-radius: 36px; padding: 36px 40px; box-shadow: 0 20px 50px rgba(255, 110, 165, 0.16);">

    <!-- Top Header Brand Logo -->
    <div class="customer-logo brand-header mb-4">
      <div class="camera-icon-badge">
        <img src="../img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
      </div>
      <div class="brand-text-group">
        <span class="brand-name-top">AXIONIX</span>
        <span class="brand-name-bottom">PHOTO 🦾 </span>
      </div>
    </div>

    <!-- 2 Column Split Grid Layout (Left Form vs Right Visual Graphic Mockup) -->
    <div style="display: grid; grid-template-columns: 1fr 340px; gap: 36px; align-items: center;">

      <!-- Left Column: Form Card -->
      <div
        style="background: #FFFFFF; border: 2px solid #FFD8E7; border-radius: 28px; padding: 28px; box-shadow: 0 10px 30px rgba(255, 110, 165, 0.08);">

        <!-- Form Header Box -->
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
          <div
            style="width: 50px; height: 50px; background: #FFF0F5; border: 2px solid #FFD8E7; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 4px 12px rgba(255, 110, 165, 0.12); flex-shrink: 0;">
            📷
          </div>
          <div>
            <h1 style="font-size: 20px; font-weight: 900; color: #3A2B42; margin: 0; line-height: 1.2;">Ambil Foto Kamu!
              📷</h1>
            <p style="font-size: 11px; font-weight: 600; color: #7A6988; margin-top: 4px; line-height: 1.3;">Masukkan
              Nama &amp; Nomor HP yang terdaftar saat foto di photobooth!</p>
          </div>
        </div>

        <form onsubmit="event.preventDefault(); doLogin();" style="display: flex; flex-direction: column; gap: 16px;">

          <!-- Field 1: Nama Lengkap -->
          <div>
            <label for="nama"
              style="display: block; font-size: 12px; font-weight: 800; color: #3A2B42; margin-bottom: 6px;">
              👤 Nama Lengkap
            </label>
            <div style="position: relative;">
              <span
                style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #FF6FA2; pointer-events: none;">👤</span>
              <input type="text" id="nama" placeholder="Ketik nama kamu..." autocomplete="name" required
                style="width: 100%; height: 46px; padding: 0 16px 0 44px; border: 2px solid #FFD8E7; border-radius: 20px; font-size: 13px; font-weight: 700; color: #3A2B42; background: #FFFFFF; outline: none; transition: all 0.2s ease;"
                onfocus="this.style.borderColor='#FF6FA2'; this.style.boxShadow='0 0 0 3px rgba(255,111,162,0.18)';"
                onblur="this.style.borderColor='#FFD8E7'; this.style.boxShadow='none';" />
            </div>
          </div>

          <!-- Field 2: Nomor WhatsApp / HP -->
          <div>
            <label for="nohp"
              style="display: block; font-size: 12px; font-weight: 800; color: #3A2B42; margin-bottom: 6px;">
              📞 Nomor WhatsApp / HP
            </label>
            <div style="position: relative;">
              <span
                style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 15px; color: #FF6FA2; pointer-events: none;">📞</span>
              <input type="tel" id="nohp" placeholder="08xxxxxxxxxx" autocomplete="tel" required
                style="width: 100%; height: 46px; padding: 0 16px 0 44px; border: 2px solid #FFD8E7; border-radius: 20px; font-size: 13px; font-weight: 700; color: #3A2B42; background: #FFFFFF; outline: none; transition: all 0.2s ease;"
                onfocus="this.style.borderColor='#FF6FA2'; this.style.boxShadow='0 0 0 3px rgba(255,111,162,0.18)';"
                onblur="this.style.borderColor='#FFD8E7'; this.style.boxShadow='none';" />
            </div>
          </div>

          <!-- Submit Button -->
          <button id="btnLogin" type="submit" class="customer-btn-primary korean-btn-gradient"
            style="width: 100%; height: 50px; border-radius: 25px; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer; box-shadow: 0 8px 24px rgba(255, 111, 162, 0.35); margin-top: 4px;">
            <span>✨ Lihat &amp; Cetak Foto Saya</span>
          </button>

        </form>

        <!-- Error Alert Banner -->
        <div id="errBox" class="hidden"
          style="margin-top: 14px; background: #FFE5EF; border: 1.5px solid #FFC2D8; color: #FF4886; font-size: 12px; font-weight: 800; padding: 10px 14px; border-radius: 16px; text-align: center;">
        </div>

        <!-- Privacy Footer Note -->
        <div
          style="font-size: 11px; font-weight: 700; color: #9B8AA9; text-align: center; margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 4px;">
          <span>🔒 Data kamu dijaga dan hanya untuk keperluan cetak foto</span>
        </div>

        <!-- Navigation Link -->
        <div style="text-align: center; margin-top: 10px;">
          <a href="../photobox-session/daftar-akun.html"
            style="font-size: 11px; font-weight: 800; color: #FF5E93; text-decoration: none; transition: all 0.2s ease;">
            Bukan tamu / Ingin foto baru? Klik di sini →
          </a>
        </div>

      </div>

      <!-- Right Column: Visual Graphics & Characters -->
      <div
        style="display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;">

        <!-- Photo Strip Sample Graphic Mockup -->
        <div style="position: relative; width: 100%; display: flex; align-items: center; justify-content: center;">
          <img src="../img/Style/12.svg" alt="Photo Strip Preview"
            style="max-width: 220px; width: 100%; height: auto; object-fit: contain; border-radius: 16px; filter: drop-shadow(0 14px 28px rgba(255, 90, 150, 0.28)); transform: rotate(5deg); transition: transform 0.3s ease;"
            onerror="this.src='../img/stip.png'; this.onerror=null;" />
        </div>

      </div>

    </div>

  </div>

  <script>
    function doLogin() { if (window._doLogin) window._doLogin(); }
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    let currentBranch = null;

    async function autoDetectBranch() {
      try {
        const stored = JSON.parse(sessionStorage.getItem("selectedBranch"));
        if (stored?.id) { currentBranch = stored; return; }
      } catch (e) { }

      try {
        const admin = JSON.parse(localStorage.getItem("currentAdmin"));
        if (admin?.branch_id) {
          const { data, error } = await supabase.from("branches").select("id,name,code").eq("id", admin.branch_id).single();
          if (!error && data) {
            currentBranch = { id: data.id, name: data.name, code: data.code };
            sessionStorage.setItem("selectedBranch", JSON.stringify(currentBranch));
            return;
          }
        }
      } catch (e) { }

      try {
        const { data: branches } = await supabase.from("branches").select("id,name,code").order("name").limit(1);
        if (branches?.length) {
          currentBranch = { id: branches[0].id, name: branches[0].name, code: branches[0].code };
          sessionStorage.setItem("selectedBranch", JSON.stringify(currentBranch));
          return;
        }
      } catch (e) { }
    }

    window._doLogin = async function () {
      hideErr();
      const nama = document.getElementById("nama").value.trim();
      const nohp = document.getElementById("nohp").value.trim().replace(/\s+/g, "");
      if (!nama || !nohp) { showErr("Nama dan nomor HP wajib diisi!"); return; }

      setLoading(true);

      try {
        let guests = [];

        if (currentBranch && currentBranch.id) {
          const { data } = await supabase.from("guests")
            .select("id,nama,nohp,branch_id")
            .ilike("nama", nama)
            .eq("nohp", nohp)
            .eq("branch_id", currentBranch.id);
          if (data) guests = data;
        }

        if (!guests.length) {
          const { data } = await supabase.from("guests")
            .select("id,nama,nohp,branch_id")
            .ilike("nama", nama)
            .eq("nohp", nohp);
          if (data) guests = data;
        }

        if (!guests.length) {
          setLoading(false);
          showErr("Nama atau nomor HP tidak ditemukan. Pastikan data sesuai yang diinput admin.");
          return;
        }

        sessionStorage.setItem("guestData", JSON.stringify({ guest: guests[0] }));
        setLoading(false);
        window.location.href = "guest-gallery.html";

      } catch (err) {
        console.error(err);
        setLoading(false);
        showErr("Terjadi kesalahan. Coba lagi.");
      }
    };

    function showErr(m) {
      const b = document.getElementById("errBox");
      b.textContent = m;
      b.classList.remove("hidden");
    }
    function hideErr() {
      document.getElementById("errBox").classList.add("hidden");
    }
    function setLoading(on) {
      const btn = document.getElementById("btnLogin");
      btn.disabled = on;
      btn.innerHTML = on ? '<span>⏳ Mencari foto...</span>' : '<span>✨ Lihat &amp; Cetak Foto Saya</span>';
    }

    autoDetectBranch();
  </script>
</body>

</html>
