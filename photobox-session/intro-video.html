<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intro Tutorial — Axionix Photobooth</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />

  <style>
    body {
      user-select: none;
    }
  </style>
</head>

<body class="customer-page korean-register-page" style="padding: 20px; overflow: hidden; height: 100vh;">

  <!-- Skyline & Background Glow -->
  <div class="korean-bg-skyline"></div>
  <div class="korean-bg-glow"></div>

  <!-- Background SVG Decorations -->
  <div class="background-decoration">
    
    <!-- Top Left: Sakura Branch (10.svg) -->
    <div class="top-left-decoration">
      <img src="../img/Style/10.svg" alt="Sakura Branch" class="decor-sakura-branch" />
    </div>

    <!-- Top Right: Ribbon Bow & Strawberry (07.svg) -->
    <div class="top-right-decoration">
      <img src="../img/Style/07.svg" alt="Ribbon & Strawberry" class="decor-ribbon-bow" />
    </div>

    <!-- Bottom Left: Photobooth Machine (01.svg), Polaroid (03.svg) & Film Strip Reel (12.svg) -->
    <div class="bottom-left-decoration">
      <img src="../img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-left" />
      <div class="filmstrip-polaroid-group">
        <img src="../img/Style/03.svg" alt="Polaroid Girl" class="decor-polaroid-left" />
        <img src="../img/Style/12.svg" alt="Film Strip Reel" class="decor-filmreel-left" />
      </div>
    </div>

    <!-- Bottom Right: Bunny (04.svg), Bear + Duck (05.svg) on Cloud (08.svg) -->
    <div class="bottom-right-decoration">
      <div class="characters-cloud-group">
        <img src="../img/Style/08.svg" alt="Cloud Base" class="decor-cloud-base" />
        <img src="../img/Style/05.svg" alt="Bear + Duck" class="decor-bear-chick" />
        <img src="../img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny-right" />
      </div>
    </div>

    <!-- Floating Sparkles (11.svg) & Hearts (09.svg) -->
    <div class="floating-items">
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp1" />
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp2" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht1" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht2" />
      <img src="../img/Style/08.svg" alt="Cloud" class="float-item cd1" />
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="modal-overlay" id="loadingOverlay" style="background: rgba(255,235,242,0.95); backdrop-filter: blur(12px); z-index: 200;">
    <div style="display:flex; flex-direction:column; align-items:center; gap: 12px;">
      <span class="animate-spin" style="width:44px; height:44px; border:4px solid #FFD8E7; border-top-color:#FF4886; border-radius:50%;"></span>
      <span class="text-sm font-semibold" style="color: #FF5E93; letter-spacing:1px; font-weight:800;">Memuat tutorial video... 🎀</span>
    </div>
  </div>

  <!-- Main Container -->
  <div class="customer-container" style="max-width: 1040px; width: 100%; height: 100%; justify-content: space-between; position: relative; z-index: 10;">
    
    <!-- Top Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; padding-top: 10px;">
      <!-- Brand Logo -->
      <div class="customer-logo brand-header">
        <div class="camera-icon-badge">
          <img src="../img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
        </div>
        <div class="brand-text-group">
          <span class="brand-name-top">AXIONIX</span>
          <span class="brand-name-bottom">PHOTOBOOTH</span>
        </div>
      </div>

      <!-- Skip Button -->
      <button class="korean-btn-gradient" id="skipBtn" onclick="goToSession()" style="width: auto; height: 42px; padding: 0 20px; border-radius: 21px !important; font-size: 14px !important; cursor: pointer;">
        <span>Lewati</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        </svg>
      </button>
    </div>

    <!-- Video Card Container (Contained & Centered - Zero Cropping!) -->
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 12px 0;">
      <div style="position: relative; width: 100%; max-width: 960px; max-height: calc(100vh - 160px); background: #000; border-radius: 28px; border: 3px solid #FFD8E7; box-shadow: 0 20px 50px rgba(255, 110, 165, 0.2); overflow: hidden; display: flex; align-items: center; justify-content: center;">
        
        <video id="introVideo" playsinline preload="auto" style="width: 100%; height: auto; max-height: calc(100vh - 170px); object-fit: contain; border-radius: 24px; display: block; margin: 0 auto;">
          <source src="../img/Sesi_Foto/0721.mp4" type="video/mp4">
        </video>

        <!-- Cute Inner Progress Bar at Bottom of Video Frame -->
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); z-index: 10;">
          <div id="progressFill" style="width: 0%; height: 100%; background: linear-gradient(90deg, #FF6FA2, #A875FF); transition: width 0.1s linear;"></div>
        </div>

      </div>
    </div>

    <!-- Bottom Helper Footer -->
    <footer class="package-footer text-center mb-2" style="flex-shrink: 0;">
      <span style="font-size: 13px; color: #FF5E93; font-weight: 700;">
        📹 Simak panduan interaktif sebelum memulai sesi foto impianmu! 💕
      </span>
    </footer>

  </div>

  <script>
    const video = document.getElementById('introVideo');
    const progressFill = document.getElementById('progressFill');
    const loadingOverlay = document.getElementById('loadingOverlay');
    let navigated = false;

    video.addEventListener('canplay', function () {
      loadingOverlay.style.display = 'none';
      video.play().catch(e => {
        console.warn('Autoplay blocked:', e);
        video.muted = true;
        video.play().catch(() => {
          goToSession();
        });
      });
    }, { once: true });

    video.addEventListener('timeupdate', function () {
      if (video.duration) {
        const pct = (video.currentTime / video.duration) * 100;
        progressFill.style.width = pct + '%';
      }
    });

    video.addEventListener('ended', function () {
      goToSession();
    });

    video.addEventListener('error', function () {
      console.warn('Video error, skipping to session');
      goToSession();
    });

    function goToSession() {
      if (navigated) return;
      navigated = true;

      document.body.style.transition = 'opacity 0.5s ease';
      document.body.style.opacity = '0';

      setTimeout(() => {
        window.location.href = 'sesi-foto.html';
      }, 500);
    }

    setTimeout(() => {
      if (video.readyState < 3 && !navigated) {
        goToSession();
      }
    }, 10000);
  </script>

</body>

</html>
