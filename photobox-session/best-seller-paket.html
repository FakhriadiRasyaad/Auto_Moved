<!DOCTYPE html>
<html lang="id">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Pilih Paket Foto — Best Seller 🔥</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />

  <script>
    if (!localStorage.getItem("currentAdmin") || !localStorage.getItem("currentUser")) {
      window.location.href = "../index.html";
    }
  </script>
</head>

<body class="customer-page korean-register-page">

  <!-- Skyline & Background Glow -->
  <div class="korean-bg-skyline"></div>
  <div class="korean-bg-glow"></div>

  <!-- Custom Alert Toast -->
  <div class="custom-alert" id="alert-banner" style="position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: #FF4886; color: #fff; padding: 12px 28px; border-radius: 30px; font-weight: 800; box-shadow: 0 10px 25px rgba(255, 72, 134, 0.4); transition: top 0.4s ease; z-index: 1000;">
    Silakan pilih paket foto terlebih dahulu! 🎀
  </div>

  <!-- Background SVG Decorations -->
  <div class="background-decoration">
    
    <!-- Top Left: Sakura Branch (10.svg) -->
    <div class="top-left-decoration">
      <img src="../img/Style/10.svg" alt="Sakura Branch" class="decor-sakura-branch" />
    </div>

    <!-- Top Right: Ribbon Bow & Strawberry (07.svg) -->
    <div class="top-right-decoration">
      <img src="../img/Style/07.svg" alt="Ribbon & Strawberry" class="decor-ribbon-bow" />
    </div>

    <!-- Bottom Left: Photobooth Machine (01.svg), Polaroid (03.svg) & Film Strip Reel (12.svg) -->
    <div class="bottom-left-decoration">
      <img src="../img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-left" />
      <div class="filmstrip-polaroid-group">
        <img src="../img/Style/03.svg" alt="Polaroid Girl" class="decor-polaroid-left" />
        <img src="../img/Style/12.svg" alt="Film Strip Reel" class="decor-filmreel-left" />
      </div>
    </div>

    <!-- Bottom Right: Bunny (04.svg), Bear + Duck (05.svg) on Cloud (08.svg) -->
    <div class="bottom-right-decoration">
      <div class="characters-cloud-group">
        <img src="../img/Style/08.svg" alt="Cloud Base" class="decor-cloud-base" />
        <img src="../img/Style/05.svg" alt="Bear + Duck" class="decor-bear-chick" />
        <img src="../img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny-right" />
      </div>
    </div>

    <!-- Floating Sparkles (11.svg) & Hearts (09.svg) -->
    <div class="floating-items">
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp1" />
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp2" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht1" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht2" />
      <img src="../img/Style/08.svg" alt="Cloud" class="float-item cd1" />
    </div>
  </div>

  <!-- Main Container -->
  <div class="customer-container main-package-container">
    
    <!-- Top Header & Stepper & Filter Pills -->
    <div class="package-header-wrap">
      
      <!-- Brand Logo -->
      <div class="customer-logo brand-header">
        <div class="camera-icon-badge">
          <img src="../img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
        </div>
        <div class="brand-text-group">
          <span class="brand-name-top">AXIONIX</span>
          <span class="brand-name-bottom">PHOTO 🦾 </span>
        </div>
      </div>

      <!-- Top Right Stepper (1 - 2 - 3 - 4) -->
      <div class="korean-stepper-pill">
        <div class="korean-step active">1</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step">2</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step">3</div>
        <span class="korean-step-dash">—</span>
        <div class="korean-step">4</div>
      </div>

    </div>

    <!-- Title Section & Filter Tabs -->
    <div class="package-title-bar">
      <div>
        <h1 class="customer-heading register-title mb-1">Paket Best Seller 🔥</h1>
        <p class="customer-subheading register-subtitle mb-0">Pilihan terfavorit dari pengunjung photobooth kami 🎀</p>
      </div>

      <!-- Filter Tabs -->
      <div class="korean-filter-tabs">
        <button class="korean-tab-btn" onclick="location.href='pilih-paket.html'">
          <span>Semua Paket</span>
        </button>
        <button class="korean-tab-btn active" onclick="location.href='best-seller-paket.html'">
          <span class="tab-heart">💕</span>
          <span>Best Seller 🔥</span>
        </button>
      </div>
    </div>

    <!-- Package Grid Container -->
    <div class="package-grid-wrapper">
      <div class="package-grid" id="packageGrid">
        <!-- Packages loaded dynamically via Supabase -->
      </div>
    </div>

    <!-- Bottom Bar: Action Button & Support Footer -->
    <div class="package-bottom-bar">
      <button class="customer-btn-primary korean-btn-gradient" id="btn-next-step" style="max-width: 380px; margin: 0 auto;">
        <span>Selanjutnya</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <footer class="package-footer text-center mt-3">
        <a href="https://www.lti.company/contact" target="_blank" rel="noopener noreferrer" class="support-link">
          <span class="support-icon">🎧</span>
          <span>Butuh bantuan? Hubungi tim support kami! 💌</span>
        </a>
      </footer>
    </div>

  </div>

  <script>
    window.selectedPackageId = localStorage.getItem('selectedPackage') || null;

    function showAlert() {
      const banner = document.getElementById('alert-banner');
      banner.style.top = '24px';
      setTimeout(() => { banner.style.top = '-100px'; }, 3000);
    }

    function selectPackage(card) {
      const nama = card.querySelector('h3').textContent.trim();
      const priceText = card.querySelector('.price-tag').textContent.trim();
      const descText = card.querySelector('.desc')?.textContent.trim() || '';
      const hargaNumeric = parseInt(priceText.replace(/[^0-9]/g, ''), 10) || 0;

      let durasiMenit = 5;
      let frameLimit = 1;
      const durasiMatch = descText.match(/Durasi\s*(\d+)\s*Menit/i) || descText.match(/(\d+)\s*Menit/i);
      const frameMatch = descText.match(/(\d+)\s*Frame/i);
      if (durasiMatch) durasiMenit = parseInt(durasiMatch[1], 10);
      if (frameMatch) frameLimit = parseInt(frameMatch[1], 10);
      const stikerGratis = descText.toLowerCase().includes('stiker gratis') || descText.toLowerCase().includes('sticker gratis');

      const registeredUser = JSON.parse(localStorage.getItem('registeredUser')) || {};
      const currentAdmin = JSON.parse(localStorage.getItem('currentAdmin')) || {};
      const selectedBranch = JSON.parse(sessionStorage.getItem('selectedBranch')) || {};
      let currentUser = JSON.parse(localStorage.getItem('currentUser')) || {
        id: 'guest_' + Date.now(),
        nama: registeredUser.username || 'Guest',
        nohp: registeredUser.phone || '',
        email: registeredUser.email || '',
        branch_id: currentAdmin.branch_id || selectedBranch.id || 'b149999f-33ec-4342-95bb-4f4961956c0b'
      };

      if (!currentUser.nama || currentUser.nama === 'Guest') {
        currentUser.nama = registeredUser.username || 'Guest';
      }
      if (!currentUser.nohp) currentUser.nohp = registeredUser.phone || '';
      if (!currentUser.email) currentUser.email = registeredUser.email || '';
      if (!currentUser.branch_id || currentUser.branch_id === 'test_branch' || currentUser.branch_id === 'b149999f-33ec-4342-95bb-4f4961956c0b') {
        currentUser.branch_id = currentAdmin.branch_id || selectedBranch.id || 'b149999f-33ec-4342-95bb-4f4961956c0b';
      }

      currentUser.paket = {
        id: card.id,
        nama: nama,
        harga: hargaNumeric,
        durasi_menit: durasiMenit,
        foto_limit: 999, // Unlimited foto selama durasi berlangsung
        frame_limit: frameLimit,
        stiker_gratis: stikerGratis
      };

      currentUser.sudahBayar = false;
      delete currentUser.session_id;
      delete currentUser.duitku_reference;

      localStorage.setItem('currentUser', JSON.stringify(currentUser));
      localStorage.setItem('selectedPackage', card.id);
      localStorage.setItem('selectedPackageName', nama);
      localStorage.setItem('selectedPackagePrice', String(hargaNumeric));
      selectedPackageId = card.id;

      document.querySelectorAll('.package-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    }

    window.onload = function () {
      if (window.selectedPackageId && document.getElementById(window.selectedPackageId)) {
        document.getElementById(window.selectedPackageId).classList.add('selected');
      }
    };

    document.getElementById('btn-next-step').addEventListener('click', function () {
      if (!window.selectedPackageId) { showAlert(); return; }
      window.location.href = 'pembayaran.html';
    });
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    async function checkPaidSession() {
      const user = JSON.parse(localStorage.getItem('currentUser')) || {};
      if (user.session_id) {
        const { data: sess } = await supabase
          .from('sessions')
          .select('status')
          .eq('id', user.session_id)
          .single();
        if (sess?.status === 'paid') {
          user.sudahBayar = true;
          localStorage.setItem('currentUser', JSON.stringify(user));
          window.location.href = 'intro-video.html';
          return true;
        } else {
          delete user.session_id;
          delete user.duitku_reference;
          localStorage.setItem('currentUser', JSON.stringify(user));
        }
      }
      return false;
    }

    async function loadPackages() {
      if (await checkPaidSession()) return;

      const grid = document.getElementById('packageGrid');
      grid.innerHTML = '<div style="color:#FF5E93;text-align:center;grid-column:1/-1;font-weight:700;" class="animate-pulse">Memuat paket Best Seller... 🎀</div>';
      
      const currentAdmin = JSON.parse(localStorage.getItem('currentAdmin')) || {};
      const selectedBranch = JSON.parse(sessionStorage.getItem('selectedBranch')) || {};
      const branchId = currentAdmin.branch_id || selectedBranch.id || 'b149999f-33ec-4342-95bb-4f4961956c0b';

      // First try fetching packages with is_best_seller = true
      let { data, error } = await supabase
        .from('packages')
        .select('*')
        .eq('branch_id', branchId)
        .eq('is_active', true)
        .eq('is_best_seller', true)
        .order('harga', { ascending: true });

      // Fallback: If no package has is_best_seller = true, load all active packages
      if (!data || data.length === 0) {
        const res = await supabase
          .from('packages')
          .select('*')
          .eq('branch_id', branchId)
          .eq('is_active', true)
          .order('harga', { ascending: true });
        data = res.data;
        error = res.error;
      }

      if (error) {
        grid.innerHTML = '<div style="color:var(--color-danger);text-align:center;grid-column:1/-1;">Gagal memuat paket Best Seller.</div>';
        console.error("Error fetching packages:", error);
        return;
      }

      if (!data || data.length === 0) {
        grid.innerHTML = '<div style="color:var(--text-secondary);text-align:center;grid-column:1/-1;">Belum ada paket foto yang tersedia untuk cabang ini.</div>';
        return;
      }

      let html = '';
      data.forEach(pkg => {
        const stikerText = pkg.stiker_gratis ? " · Stiker Gratis" : "";
        const durasiMenit = pkg.durasi_menit || (pkg.foto_limit <= 5 ? 5 : (pkg.foto_limit <= 10 ? 10 : 15));
        const limitFrameText = pkg.frame_limit >= 999 ? "All" : pkg.frame_limit;
        const desc = `Durasi ${durasiMenit} Menit · ${limitFrameText} Frame / Cetak${stikerText}`;
        const limitBadge = `<span class="korean-pkg-top-badge">⏱️ DURASI ${durasiMenit} MENIT</span>`;

        html += `
          <div class="package-card korean-package-card" id="pkg-${pkg.id}" onclick="selectPackage(this)">
            <span class="best-seller-badge">🔥 Best Seller</span>
            ${limitBadge}

            <div class="korean-pkg-body">
              <div class="korean-pkg-left">
                <h3>${pkg.nama}</h3>
                <div class="korean-pkg-accent-subtitle">Stiker Cute</div>
                <p class="desc">${desc}</p>

                <!-- Mini Features Grid -->
                <div class="korean-mini-features">
                  <div class="mini-feat-box">
                    <span class="feat-icon">⏱️</span>
                    <span class="feat-text">Durasi ${durasiMenit} Menit</span>
                  </div>
                  <div class="mini-feat-box">
                    <span class="feat-icon">🖨️</span>
                    <span class="feat-text">${limitFrameText} Frame / Cetak</span>
                  </div>
                  <div class="mini-feat-box">
                    <span class="feat-icon">📸</span>
                    <span class="feat-text">Foto Unlimited</span>
                  </div>
                  <div class="mini-feat-box">
                    <span class="feat-icon">🐰</span>
                    <span class="feat-text">${pkg.stiker_gratis ? "Stiker Cute" : "Tanpa Stiker"}</span>
                  </div>
                </div>
              </div>

              <div class="korean-pkg-right-mockup">
                <img src="../img/strip-photo.png" alt="Sample Strip" class="korean-sample-strip" />
                <span class="cute-bear-badge">🐻</span>
              </div>
            </div>

            <div class="korean-pkg-divider"></div>

            <div class="korean-pkg-footer">
              <span class="price-tag">Rp${pkg.harga.toLocaleString("id-ID")}</span>
              <span class="select-check-icon">💕</span>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;

      if (window.selectedPackageId && document.getElementById(window.selectedPackageId)) {
        document.getElementById(window.selectedPackageId).classList.add('selected');
      }
    }

    loadPackages();
  </script>
</body>

</html>
