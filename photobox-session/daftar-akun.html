<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun — Axionix Photobooth</title>
  <meta name="description" content="Daftar akun Photobooth baru. Isi data diri Anda untuk memulai sesi foto premium." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>

<body class="customer-page korean-register-page">

  <!-- Guard: cek admin login -->
  <script>
    if (!localStorage.getItem("currentAdmin")) {
      window.location.href = "../index.html";
    }
  </script>

  <!-- Skyline & Background Glow -->
  <div class="korean-bg-skyline"></div>
  <div class="korean-bg-glow"></div>

  <!-- Background SVG Decorations -->
  <div class="background-decoration">

    <!-- Top Left: Sakura Branch (10.svg) -->
    <div class="top-left-decoration">
      <img src="../img/Style/10.svg" alt="Sakura Branch" class="decor-sakura-branch" />
    </div>

    <!-- Top Right: Ribbon Bow & Strawberry (07.svg) -->
    <div class="top-right-decoration">
      <img src="../img/Style/07.svg" alt="Ribbon & Strawberry" class="decor-ribbon-bow" />
    </div>

    <!-- Bottom Left: Photobooth Machine (01.svg), Film Strip (06.svg) & Polaroid (03.svg) -->
    <div class="bottom-left-decoration">
      <img src="../img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-left" />
      <div class="filmstrip-polaroid-group">
        <img src="../img/Style/03.svg" alt="Polaroid" class="decor-polaroid-left" />
        <img src="../img/Style/06.svg" alt="Film Strip" class="decor-filmstrip-left" />
      </div>
    </div>

    <!-- Bottom Right: Bunny (04.svg), Bear + Duck (05.svg) on Cloud (08.svg) -->
    <div class="bottom-right-decoration">
      <div class="characters-cloud-group">
        <img src="../img/Style/08.svg" alt="Cloud Base" class="decor-cloud-base" />
        <img src="../img/Style/05.svg" alt="Bear + Duck" class="decor-bear-chick" />
        <img src="../img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny-right" />
      </div>
    </div>

    <!-- Floating Sparkles (11.svg) & Hearts (09.svg) -->
    <div class="floating-items">
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp1" />
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp2" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht1" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht2" />
      <img src="../img/Style/08.svg" alt="Cloud" class="float-item cd1" />
    </div>
  </div>

  <!-- Main Container -->
  <div class="customer-container main-register-container">

    <!-- Split Registration Card -->
    <div class="customer-split korean-register-card">

      <!-- Left Pane: Form (White Background) -->
      <div class="customer-split-left korean-form-pane">
        <div class="form-content-wrap">

          <!-- Brand Logo -->
          <div class="customer-logo brand-header mb-2">
            <div class="camera-icon-badge">
              <img src="../img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
            </div>
            <div class="brand-text-group">
              <span class="brand-name-top">AXIONIX</span>
              <span class="brand-name-bottom">PHOTOBOOTH</span>
            </div>
          </div>

          <!-- Title & Subtitle -->
          <h1 class="customer-heading register-title">Sign-in ✨</h1>
          <p class="customer-subheading register-subtitle mb-4">Isi data dirimu untuk mulai foto seru! 🎀</p>

          <!-- Registration Form -->
          <form id="userForm" class="korean-register-form">

            <!-- Username Input -->
            <div class="customer-input-group mb-3">
              <label for="username" class="customer-input-label">
                <span class="input-label-icon">👤</span>
                <span>Username / Nama</span>
              </label>
              <div class="input-field-relative">
                <input type="text" id="username" placeholder="Nama lengkap kamu" class="customer-input pill-input"
                  required autocomplete="name" />
              </div>
            </div>

            <!-- Email Input -->
            <div class="customer-input-group mb-3">
              <label for="email" class="customer-input-label">
                <span class="input-label-icon">✉️</span>
                <span>E-mail <span class="text-tertiary font-regular">(opsional)</span></span>
              </label>
              <div class="input-field-relative">
                <input type="email" id="email" placeholder="email@contoh.com" class="customer-input pill-input"
                  autocomplete="email" />
              </div>
            </div>

            <!-- WhatsApp / Phone Input -->
            <div class="customer-input-group mb-3">
              <label for="phone" class="customer-input-label">
                <span class="input-label-icon">📞</span>
                <span>No. WhatsApp / HP</span>
              </label>
              <div class="input-field-relative">
                <input type="tel" id="phone" placeholder="0812 3456 7890" class="customer-input pill-input" required
                  autocomplete="tel" />
              </div>
            </div>

            <!-- Agreement Checkbox -->
            <label class="checkbox-wrapper agreement-checkbox mb-4">
              <input type="checkbox" id="agreement" class="checkbox" required />
              <span class="text-xs text-secondary">Saya setuju dengan <a href="#" class="pink-link">Syarat &amp;
                  Ketentuan</a> serta <a href="#" class="pink-link">Kebijakan Privasi</a></span>
            </label>

            <!-- Submit Button -->
            <button type="submit" class="customer-btn-primary korean-btn-gradient" id="btn-submit-register">
              <span>Selanjutnya</span>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </form>

          <!-- Login Redirect Link -->
          <div class="text-center text-xs text-secondary mt-4">
            Sudah punya akun? <a href="login-akun.html" class="text-accent font-bold pink-highlight-link">Masuk di
              sini</a>
          </div>

        </div>
      </div>

      <!-- Right Pane: Photo Showcase Illustration (Soft Purple/Pink Pastel Background) -->
      <div class="customer-split-right korean-showcase-pane">

        <!-- Floating Decor Inside Right Pane -->
        <div class="showcase-decor-wrap">
          <span class="right-decor-sparkle sp-top">✨</span>
          <span class="right-decor-heart ht-top">💖</span>
          <span class="right-decor-arrow">⤵</span>

          <!-- Photo Strip & Device Showcase -->
          <div class="photo-showcase-mockup">
            <img class="strip-photo-float" src="../img/Style/12.svg" alt="Photo strip showcase" />
          </div>
        </div>

      </div>

    </div>

  </div>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    // Auto-authenticate in background if using testing account bypass
    (async function autoAuth() {
      const admin = JSON.parse(localStorage.getItem("currentAdmin"));
      if (admin && admin.username === "1@admin.com") {
        try {
          const { data } = await supabase.auth.getSession();
          if (!data.session) {
            console.log("Bypass mode detected: logging in to Supabase Auth...");
            await supabase.auth.signInWithPassword({ email: "1@admin.com", password: "1" });
          }
        } catch (e) {
          console.error("Gagal auto-auth:", e);
        }
      }
    })();

    // ══════════════════════════════════════════════
    //  FORM SUBMIT
    // ══════════════════════════════════════════════
    document.getElementById("userForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const admin = JSON.parse(localStorage.getItem("currentAdmin"));
      if (!admin) {
        alert("Sesi admin tidak valid. Silakan login kembali.");
        window.location.href = "../index.html";
        return;
      }

      const nama = document.getElementById("username").value.trim();
      const nohp = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim() || null;
      const agreement = document.getElementById("agreement").checked;

      if (!nama || !nohp) {
        alert("Nama dan nomor HP wajib diisi!");
        return;
      }

      if (!agreement) {
        alert("Anda harus menyetujui Syarat & Ketentuan yang berlaku.");
        return;
      }

      let branchId = admin.branch_id || null;

      if (!branchId) {
        const { data: pd } = await supabase.rpc("get_my_profile");
        branchId = pd?.[0]?.branch_id ?? null;
      }

      if (!branchId) {
        alert("Akun ini tidak terhubung ke cabang. Hubungi superadmin.");
        return;
      }

      const { data: existing, error: searchErr } = await supabase
        .from("guests")
        .select("*")
        .eq("nohp", nohp)
        .eq("branch_id", branchId)
        .eq("nama", nama);

      if (searchErr) {
        alert(`Error: ${searchErr.message}`);
        return;
      }

      const existingUser = existing?.[0] ?? null;

      if (existingUser) {
        const emailMatch = email === null || existingUser.email === null
          ? true
          : existingUser.email.toLowerCase() === email.toLowerCase();

        if (!emailMatch) {
          alert("Nomor HP sudah terdaftar, tapi email tidak cocok.");
          return;
        }

        const cleanPhoneExist = (existingUser.nohp || "").replace(/[^0-9]/g, "");
        const validEmailExist = (existingUser.email && existingUser.email.trim().includes("@"))
          ? existingUser.email.trim()
          : (cleanPhoneExist ? `${cleanPhoneExist}@photobooth.com` : `customer_${existingUser.id || Date.now()}@photobooth.com`);

        localStorage.setItem("currentUser", JSON.stringify({
          id: existingUser.id,
          nama: existingUser.nama,
          nohp: existingUser.nohp,
          email: validEmailExist,
          branch_id: existingUser.branch_id,
          admin_id: admin.id,
          foto: []
        }));
        window.location.href = "pilih-paket.html";
        return;
      }

      const { data, error } = await supabase
        .from("guests")
        .insert([{ nama, nohp, email, branch_id: branchId }])
        .select().single();

      if (error) {
        if (error.code === "23505") {
          alert("Data sudah terdaftar dengan konflik. Hubungi admin.");
        } else {
          alert("Terjadi kesalahan sistem. Coba lagi.");
          console.error(error);
        }
        return;
      }

      const cleanPhoneNew = (data.nohp || "").replace(/[^0-9]/g, "");
      const validEmailNew = (data.email && data.email.trim().includes("@"))
        ? data.email.trim()
        : (cleanPhoneNew ? `${cleanPhoneNew}@photobooth.com` : `customer_${data.id || Date.now()}@photobooth.com`);

      localStorage.setItem("currentUser", JSON.stringify({
        id: data.id,
        nama: data.nama,
        nohp: data.nohp,
        email: validEmailNew,
        branch_id: data.branch_id,
        admin_id: admin.id,
        foto: []
      }));

      window.location.href = "pilih-paket.html";
    });
  </script>
</body>

</html>
