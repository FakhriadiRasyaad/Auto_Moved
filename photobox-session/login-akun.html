<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk Akun — Axionix Photobooth</title>
  <meta name="description" content="Masuk ke akun Photobooth Anda untuk memulai sesi foto premium." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/customer.css" />
</head>

<body class="customer-page korean-register-page">

  <!-- Guard: cek admin login -->
  <script>
    if (!localStorage.getItem("currentAdmin")) {
      window.location.href = "../login-admin.html";
    }
  </script>

  <!-- Skyline & Background Glow -->
  <div class="korean-bg-skyline"></div>
  <div class="korean-bg-glow"></div>

  <!-- Background SVG Decorations -->
  <div class="background-decoration">

    <!-- Top Left: Sakura Branch (10.svg) -->
    <div class="top-left-decoration">
      <img src="../img/Style/10.svg" alt="Sakura Branch" class="decor-sakura-branch" />
    </div>

    <!-- Top Right: Ribbon Bow & Strawberry (07.svg) -->
    <div class="top-right-decoration">
      <img src="../img/Style/07.svg" alt="Ribbon & Strawberry" class="decor-ribbon-bow" />
    </div>

    <!-- Bottom Left: Photobooth Machine (01.svg), Film Strip (06.svg) & Polaroid (03.svg) -->
    <div class="bottom-left-decoration">
      <img src="../img/Style/01.svg" alt="Photobooth Machine" class="decor-photobooth-left" />
      <div class="filmstrip-polaroid-group">
        <img src="../img/Style/03.svg" alt="Polaroid" class="decor-polaroid-left" />
        <img src="../img/Style/06.svg" alt="Film Strip" class="decor-filmstrip-left" />
      </div>
    </div>

    <!-- Bottom Right: Bunny (04.svg), Bear + Duck (05.svg) on Cloud (08.svg) -->
    <div class="bottom-right-decoration">
      <div class="characters-cloud-group">
        <img src="../img/Style/08.svg" alt="Cloud Base" class="decor-cloud-base" />
        <img src="../img/Style/05.svg" alt="Bear + Duck" class="decor-bear-chick" />
        <img src="../img/Style/04.svg" alt="Bunny with Camera" class="decor-bunny-right" />
      </div>
    </div>

    <!-- Floating Sparkles (11.svg) & Hearts (09.svg) -->
    <div class="floating-items">
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp1" />
      <img src="../img/Style/11.svg" alt="Sparkle" class="float-item sp2" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht1" />
      <img src="../img/Style/09.svg" alt="Heart" class="float-item ht2" />
      <img src="../img/Style/08.svg" alt="Cloud" class="float-item cd1" />
    </div>
  </div>

  <!-- Main Container -->
  <div class="customer-container main-register-container">

    <!-- Split Login Card -->
    <div class="customer-split korean-register-card">

      <!-- Left Pane: Form (White Background) -->
      <div class="customer-split-left korean-form-pane">
        <div class="form-content-wrap">

          <!-- Brand Logo -->
          <div class="customer-logo brand-header mb-2">
            <div class="camera-icon-badge">
              <img src="../img/Logo_photobooth_LTI.png" alt="Camera Logo" class="brand-camera-svg" />
            </div>
            <div class="brand-text-group">
              <span class="brand-name-top">AXIONIX</span>
              <span class="brand-name-bottom">PHOTO 🦾 </span>
            </div>
          </div>

          <!-- Title & Subtitle -->
          <h1 class="customer-heading register-title">Login 👋</h1>
          <p class="customer-subheading register-subtitle mb-4">Masukkan nama dan nomor HP kamu untuk melanjutkan sesi
            foto 🎀</p>

          <!-- Login Input Fields -->
          <div class="customer-input-group mb-3">
            <label for="nama" class="customer-input-label">
              <span class="input-label-icon">👤</span>
              <span>Username / Nama</span>
            </label>
            <div class="input-field-relative">
              <input type="text" id="nama" placeholder="cth: Budi Santoso" class="customer-input pill-input"
                autocomplete="name" />
            </div>
          </div>

          <div class="customer-input-group mb-3">
            <label for="nohp" class="customer-input-label">
              <span class="input-label-icon">📞</span>
              <span>Nomor WhatsApp / HP</span>
            </label>
            <div class="input-field-relative">
              <input type="tel" id="nohp" placeholder="cth: 081234567890" class="customer-input pill-input"
                autocomplete="tel" />
            </div>
          </div>

          <!-- Error Message Box -->
          <div id="errBox" class="badge badge-danger p-3 w-full text-center mb-4 hidden"></div>

          <!-- Submit Button -->
          <button class="customer-btn-primary korean-btn-gradient mt-2" id="btnLogin" onclick="doLogin()">
            <span>Selanjutnya</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>

          <!-- Register Redirect Link -->
          <div class="text-center text-xs text-secondary mt-4">
            Belum punya akun? <a href="daftar-akun.html" class="text-accent font-bold pink-highlight-link">Daftar di
              sini</a>
          </div>

        </div>
      </div>

      <!-- Right Pane: Photo Showcase Illustration (Soft Purple/Pink Pastel Background) -->
      <div class="customer-split-right korean-showcase-pane">

        <!-- Floating Decor Inside Right Pane -->
        <div class="showcase-decor-wrap">
          <span class="right-decor-sparkle sp-top">✨</span>
          <span class="right-decor-heart ht-top">💖</span>
          <span class="right-decor-arrow">⤵</span>

          <!-- Photo Strip Showcase -->
          <div class="photo-showcase-mockup">
            <img class="strip-photo-float" src="../img/Style/12.svg" alt="Photo strip showcase" />
          </div>
        </div>

      </div>

    </div>

  </div>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    // ── GET ADMIN & BRANCH DETAILS ──────────────────────────────────────
    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    let branchId = null;

    if (admin) {
      branchId = admin.branch_id || null;
    }

    async function getBranchDetails() {
      if (!admin) return;

      try {
        const { data } = await supabase.auth.getSession();
        if (!data.session) {
          console.log("Auto-auth: logging in to Supabase Auth...");
          await supabase.auth.signInWithPassword({ email: "lti@gmail.com", password: "12345678" });
        }
      } catch (e) {
        console.error("Gagal auto-auth:", e);
      }

      if (!branchId) {
        try {
          const { data: pd } = await supabase.rpc("get_my_profile");
          branchId = pd?.[0]?.branch_id ?? null;
        } catch (e) {
          console.error("Gagal mendeteksi cabang:", e);
        }
      }
    }

    // ── LOGIN PROCESS ────────────────────────────────────────────────────
    window.doLogin = async function () {
      hideErr();
      const nama = document.getElementById("nama").value.trim();
      const rawNohp = document.getElementById("nohp").value.trim();

      if (!nama || !rawNohp) {
        showErr("Username dan nomor HP wajib diisi!");
        return;
      }

      setLoading(true);

      try {
        try {
          const { data } = await supabase.auth.getSession();
          if (!data.session) {
            console.log("Auto-auth: logging in to Supabase Auth in doLogin...");
            await supabase.auth.signInWithPassword({ email: "lti@gmail.com", password: "12345678" });
          }
        } catch (e) {
          console.error("Gagal auto-auth saat doLogin:", e);
        }

        if (!branchId && admin) {
          try {
            const { data: pd } = await supabase.rpc("get_my_profile");
            branchId = pd?.[0]?.branch_id ?? null;
          } catch (e) {
            console.error("Gagal mendeteksi cabang:", e);
          }
        }

        const cleanInputPhone = rawNohp.replace(/[^0-9]/g, "");
        let matchedUser = null;

        if (branchId) {
          const { data, error } = await supabase.from("guests")
            .select("id,nama,nohp,email,branch_id")
            .ilike("nama", nama)
            .eq("branch_id", branchId);

          if (!error && data && data.length) {
            matchedUser = data.find(g => {
              const cleanDbPhone = (g.nohp || "").replace(/[^0-9]/g, "");
              return cleanDbPhone === cleanInputPhone || g.nohp.trim() === rawNohp;
            });
          }
        }

        if (!matchedUser) {
          const { data, error } = await supabase.from("guests")
            .select("id,nama,nohp,email,branch_id")
            .ilike("nama", nama);

          if (!error && data && data.length) {
            matchedUser = data.find(g => {
              const cleanDbPhone = (g.nohp || "").replace(/[^0-9]/g, "");
              return cleanDbPhone === cleanInputPhone || g.nohp.trim() === rawNohp;
            });
          }
        }

        if (!matchedUser) {
          let { data, error } = await supabase.from("guests")
            .select("id,nama,nohp,email,branch_id")
            .eq("nohp", rawNohp);

          if (!error && data && data.length) {
            matchedUser = data[0];
          } else {
            const { data: dataClean, error: errorClean } = await supabase.from("guests")
              .select("id,nama,nohp,email,branch_id")
              .eq("nohp", cleanInputPhone);
            if (!errorClean && dataClean && dataClean.length) {
              matchedUser = dataClean[0];
            }
          }
        }

        if (!matchedUser) {
          setLoading(false);
          showErr("Akun tidak ditemukan. Silakan daftarkan akun baru.");
          return;
        }

        const cleanPhone = (matchedUser.nohp || "").replace(/[^0-9]/g, "");
        const validEmail = (matchedUser.email && matchedUser.email.trim().includes("@"))
          ? matchedUser.email.trim()
          : (cleanPhone ? `${cleanPhone}@photobooth.com` : `customer_${matchedUser.id || Date.now()}@photobooth.com`);

        localStorage.setItem("currentUser", JSON.stringify({
          id: matchedUser.id,
          nama: matchedUser.nama,
          nohp: matchedUser.nohp,
          email: validEmail,
          branch_id: matchedUser.branch_id,
          admin_id: admin ? admin.id : null,
          foto: []
        }));

        setLoading(false);
        window.location.href = "pilih-paket.html";

      } catch (err) {
        console.error(err);
        setLoading(false);
        showErr("Terjadi kesalahan sistem. Coba lagi.");
      }
    };

    function showErr(m) {
      const b = document.getElementById("errBox");
      b.textContent = m;
      b.classList.remove("hidden");
    }

    function hideErr() {
      const b = document.getElementById("errBox");
      b.classList.add("hidden");
    }

    function setLoading(on) {
      const btn = document.getElementById("btnLogin");
      btn.disabled = on;
      if (on) {
        btn.innerHTML = '<span class="animate-spin" style="display:inline-block;width:18px;height:18px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;"></span> <span>Memproses...</span>';
      } else {
        btn.innerHTML = '<span>Selanjutnya</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
      }
    }

    document.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        doLogin();
      }
    });

    getBranchDetails();
  </script>
</body>

</html>
