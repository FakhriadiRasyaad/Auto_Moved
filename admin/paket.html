<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Paket — Axionix Admin</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>

<body class="admin-page">

  <script>
    if (!localStorage.getItem("currentAdmin")) {
      window.location.href = "../index.html";
    }
  </script>

  <!-- SIDEBAR BACKDROP FOR MOBILE -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleMobileSidebar()"></div>

  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="admin-sidebar-header">
        <div class="admin-sidebar-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <div class="admin-sidebar-title-group">
          <span class="admin-sidebar-title">Axionix Photobooth</span>
          <span class="admin-sidebar-subtitle">Admin Workspace</span>
        </div>
      </div>

      <nav class="admin-sidebar-nav">
        <div class="admin-sidebar-section-label">Main Menu</div>
        <button class="admin-sidebar-item" onclick="window.location.href='dashboard.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>Overview</span>
        </button>

        <button class="admin-sidebar-item active" onclick="location.reload()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          </svg>
          <span>Kelola Paket</span>
        </button>

        <button class="admin-sidebar-item" onclick="window.location.href='payment.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
          <span>Payment Setting</span>
        </button>

        <div class="admin-sidebar-section-label">Assets &amp; Content</div>
        <button class="admin-sidebar-item" onclick="window.location.href='edit-frame.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Edit Frame</span>
        </button>

        <button class="admin-sidebar-item" onclick="window.location.href='edit-stiker.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
          </svg>
          <span>Edit Stiker</span>
        </button>

        <div class="admin-sidebar-section-label">Reports &amp; Gallery</div>
        <button class="admin-sidebar-item" onclick="window.location.href='folder.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Folder Foto</span>
        </button>

        <button class="admin-sidebar-item" onclick="window.location.href='../result/guest-login.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Data Customer</span>
        </button>
      </nav>

      <div class="admin-sidebar-footer">
        <div class="admin-sidebar-user">
          <div class="admin-user-avatar" id="avatarInitial">A</div>
          <div class="admin-sidebar-user-info" id="adminInfo">
            <div class="admin-sidebar-user-name">Loading...</div>
          </div>
        </div>

        <button class="admin-sidebar-item text-danger" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-left">
          <button class="mobile-nav-toggle" onclick="toggleMobileSidebar()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <div>
            <h1 class="admin-topbar-title">Kelola Paket Foto 🎁</h1>
            <span class="admin-topbar-subtitle" id="cabangLabel">Loading cabang...</span>
          </div>
        </div>

        <div class="admin-topbar-right">
          <button class="btn btn-primary btn-sm" onclick="tambahPaket()" style="box-shadow:0 8px 20px rgba(255, 51, 133, 0.35);">
            <span>＋ Tambah Paket Baru</span>
          </button>
        </div>
      </div>

      <div class="admin-content">
        <div class="admin-package-grid" id="paketList">
          <p class="text-xs text-tertiary">Loading data paket...</p>
        </div>
      </div>
    </main>

  </div>

  <!-- MODAL EDIT/TAMBAH -->
  <div class="modal-overlay" id="modal" style="display:none; background:rgba(14, 11, 22, 0.6); backdrop-filter:blur(8px);" onclick="if(event.target.id==='modal')tutupModal()">
    <div class="modal max-w-md w-full" style="background:#FFFFFF; border-radius:28px; padding:28px; box-shadow:0 24px 60px rgba(0,0,0,0.2);">
      <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid #F0E6F4; padding-bottom:12px;">
        <h2 class="modal-title" id="modalTitle" style="font-family:'Plus Jakarta Sans', sans-serif; font-size:18px; font-weight:800; color:#261B2E;">Tambah Paket</h2>
        <button class="modal-close" onclick="tutupModal()" style="background:none; border:none; font-size:20px; cursor:pointer; color:#8C7B99;">✕</button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="paketId">

        <div class="input-group mb-3" style="margin-bottom:16px;">
          <label for="formNama" class="input-label">Nama Paket</label>
          <input type="text" id="formNama" placeholder="misal: Paket Basic / Studio 1" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
        </div>

        <div class="input-group mb-3" style="margin-bottom:16px;">
          <label for="formHarga" class="input-label">Harga (Rp)</label>
          <input type="number" id="formHarga" placeholder="50000" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
        </div>

        <div class="grid" style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;">
          <div class="input-group">
            <label for="formFotoLimit" class="input-label">Durasi (Menit)</label>
            <input type="number" id="formFotoLimit" placeholder="5 atau 10 menit" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
          </div>

          <div class="input-group">
            <label for="formFrameLimit" class="input-label">Frame / Cetak</label>
            <input type="number" id="formFrameLimit" placeholder="misal: 1, 2" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
          </div>
        <div class="input-group mb-3" style="margin-bottom:16px;">
          <label for="formBiayaFullFoto" class="input-label">Biaya Unlock Full Foto (Rp)</label>
          <input type="number" id="formBiayaFullFoto" placeholder="15000" class="input pill-input" style="height:48px !important; border-radius:14px !important;" required>
        </div>

        <div class="card p-3 my-4" style="background:#FAF7FC; border:1px solid #F0E6F4; border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; margin-bottom:20px;">
          <label class="checkbox-wrapper" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="formStikerGratis" class="checkbox">
            <span class="text-xs font-semibold" style="font-weight:700; color:#4A3A54;">Stiker Gratis</span>
          </label>
          <label class="checkbox-wrapper" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="formHighlight" class="checkbox">
            <span class="text-xs font-semibold" style="font-weight:700; color:#4A3A54;">🔥 Tandai Best Seller</span>
          </label>
          <label class="checkbox-wrapper" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="formActive" class="checkbox" checked>
            <span class="text-xs font-semibold" style="font-weight:700; color:#4A3A54;">Status Aktif (Tampil di Kios)</span>
          </label>
        </div>

        <div style="display:flex; gap:12px;">
          <button class="btn btn-outline flex-1" onclick="tutupModal()" style="border-radius:14px; padding:12px;">Batal</button>
          <button class="btn btn-primary flex-1" onclick="simpanPaket()" style="border-radius:14px; padding:12px; box-shadow:0 8px 20px rgba(255,51,133,0.35);">Simpan Paket</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleMobileSidebar() {
      const sb = document.getElementById("adminSidebar");
      const bd = document.getElementById("sidebarBackdrop");
      if (sb && bd) {
        sb.classList.toggle("open");
        bd.classList.toggle("active");
      }
    }

    function tambahPaket() { if (window._tambahPaket) window._tambahPaket(); }
    function editPaket(id) { if (window._editPaket) window._editPaket(id); }
    function simpanPaket() { if (window._simpanPaket) window._simpanPaket(); }
    function hapusPaket(id) { if (window._hapusPaket) window._hapusPaket(id); }
    function tutupModal() { document.getElementById("modal").style.display = "none"; }
    function logout() {
      localStorage.clear();
      window.location.href = "../index.html";
    }
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    const branchId = admin.branch_id;
    const branchName = admin.branch_name ?? admin.username ?? "Cabang";

    document.getElementById("cabangLabel").innerText = `Cabang: ${branchName}`;
    document.getElementById("avatarInitial").textContent = branchName.charAt(0).toUpperCase();

    document.getElementById("adminInfo").innerHTML =
      `<div class="admin-sidebar-user-name">${branchName}</div><div class="admin-sidebar-user-role">${admin.role ?? "Admin"}</div>`;

    async function loadPakets() {
      const list = document.getElementById("paketList");

      const { data, error } = await supabase
        .from("packages")
        .select("*")
        .eq("branch_id", branchId)
        .order("harga", { ascending: true });

      if (error) { list.innerHTML = `<p class="text-xs text-danger">Gagal load: ${error.message}</p>`; return; }

      if (!data || data.length === 0) {
        list.innerHTML = `<div class="empty-state" style="grid-column:1/-1; text-align:center; padding:40px;"><div class="empty-state-icon" style="font-size:40px;">🎁</div><div class="empty-state-title" style="font-weight:800; margin-top:8px;">Belum ada paket foto</div><div class="empty-state-text" style="font-size:13px; color:#8C7B99; margin-top:4px;">Klik "+ Tambah Paket Baru" untuk membuat pilihan paket foto.</div></div>`;
        return;
      }

      list.innerHTML = data.map(p => {
        const durasiVal = p.durasi_menit || (p.foto_limit <= 5 ? 5 : (p.foto_limit <= 10 ? 10 : 15));
        return `
        <div class="admin-package-card ${!p.is_active ? "opacity-50" : ""}">
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <div class="admin-package-name">${p.nama} ${p.is_highlight ? "🔥" : ""}</div>
              ${!p.is_active ? '<span class="badge badge-danger mt-1">Nonaktif</span>' : ''}
            </div>
            <div class="admin-package-price">Rp ${p.harga.toLocaleString("id-ID")}</div>
          </div>

          <div class="admin-package-features mt-2">
            <div class="admin-package-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>⏱️ Durasi ${durasiVal} Menit (Foto Unlimited)</span>
            </div>
            <div class="admin-package-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>🖨️ ${p.frame_limit >= 999 ? "Semua" : p.frame_limit} Frame / Cetak</span>
            </div>
            <div class="admin-package-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>${p.stiker_gratis ? "Stiker Gratis Included" : "Tanpa Stiker"}</span>
            </div>
            <div class="admin-package-feature">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>🔓 Biaya Full Foto: Rp ${(p.biaya_full_foto || 15000).toLocaleString("id-ID")}</span>
            </div>
          </div>

          <div class="admin-package-actions">
            <button class="btn btn-outline btn-sm flex-1" onclick="editPaket('${p.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="hapusPaket('${p.id}')">Hapus</button>
          </div>
        </div>
      `;
      }).join("");
    }

    window._tambahPaket = function () {
      document.getElementById("modalTitle").innerText = "Tambah Paket Foto";
      document.getElementById("paketId").value = "";
      document.getElementById("formNama").value = "";
      document.getElementById("formHarga").value = "";
      document.getElementById("formFotoLimit").value = "3";
      document.getElementById("formFrameLimit").value = "1";
      document.getElementById("formBiayaFullFoto").value = "15000";
      document.getElementById("formStikerGratis").checked = false;
      document.getElementById("formHighlight").checked = false;
      document.getElementById("formActive").checked = true;
      document.getElementById("modal").style.display = "flex";
    };

    window._editPaket = async function (id) {
      const { data, error } = await supabase
        .from("packages").select("*").eq("id", id).single();

      if (error || !data) { alert("Gagal load data paket!"); return; }

      document.getElementById("modalTitle").innerText = "Edit Paket Foto";
      document.getElementById("paketId").value = data.id;
      document.getElementById("formNama").value = data.nama;
      document.getElementById("formHarga").value = data.harga;
      document.getElementById("formFotoLimit").value = data.foto_limit;
      document.getElementById("formFrameLimit").value = data.frame_limit;
      document.getElementById("formBiayaFullFoto").value = data.biaya_full_foto || 15000;
      document.getElementById("formStikerGratis").checked = data.stiker_gratis;
      document.getElementById("formHighlight").checked = data.is_highlight;
      document.getElementById("formActive").checked = data.is_active;
      document.getElementById("modal").style.display = "flex";
    };

    window._simpanPaket = async function () {
      const id = document.getElementById("paketId").value;
      const nama = document.getElementById("formNama").value.trim();
      const harga = parseInt(document.getElementById("formHarga").value);
      const foto_limit = parseInt(document.getElementById("formFotoLimit").value);
      const frame_limit = parseInt(document.getElementById("formFrameLimit").value);
      const rawBiaya = document.getElementById("formBiayaFullFoto").value;
      const biaya_full_foto = (rawBiaya !== "" && !isNaN(rawBiaya)) ? parseInt(rawBiaya) : 15000;
      const stiker_gratis = document.getElementById("formStikerGratis").checked;
      const is_highlight = document.getElementById("formHighlight").checked;
      const is_active = document.getElementById("formActive").checked;

      if (!nama || !harga) { alert("Nama dan harga wajib diisi!"); return; }

      const payload = {
        nama, harga, foto_limit, frame_limit, biaya_full_foto,
        stiker_gratis, is_highlight, is_active,
        branch_id: branchId
      };

      let { error } = id
        ? await supabase.from("packages").update(payload).eq("id", id)
        : await supabase.from("packages").insert([payload]);

      if (error && error.message && error.message.includes("biaya_full_foto")) {
        delete payload.biaya_full_foto;
        const retry = id
          ? await supabase.from("packages").update(payload).eq("id", id)
          : await supabase.from("packages").insert([payload]);
        error = retry.error;
      }

      if (error) { alert("Gagal simpan: " + error.message); return; }

      tutupModal();
      loadPakets();
    };

    window._hapusPaket = async function (id) {
      if (!confirm("Yakin hapus paket ini?")) return;
      const { error } = await supabase.from("packages").delete().eq("id", id);
      if (error) { alert("Gagal hapus: " + error.message); return; }
      loadPakets();
    };

    loadPakets();
  </script>
</body>

</html>
