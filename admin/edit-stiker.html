<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Stiker — Axionix Admin</title>

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Axionix Design System -->
  <link rel="stylesheet" href="../assets/css/design-system.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
</head>

<body class="admin-page">

  <script>
    if (!localStorage.getItem("currentAdmin")) {
      window.location.href = "../index.html";
    }
  </script>

  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <div class="admin-sidebar-logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
        </div>
        <span class="admin-sidebar-title">Axionix Admin</span>
      </div>

      <nav class="admin-sidebar-nav">
        <button class="admin-sidebar-item" onclick="window.location.href='dashboard.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <span>Overview</span>
        </button>

        <button class="admin-sidebar-item" onclick="window.location.href='paket.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path
              d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z">
            </path>
          </svg>
          <span>Kelola Paket</span>
        </button>

        <button class="admin-sidebar-item" onclick="window.location.href='payment.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
            <line x1="1" y1="10" x2="23" y2="10"></line>
          </svg>
          <span>Payment Setting</span>
        </button>

        <button class="admin-sidebar-item" onclick="window.location.href='edit-frame.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Edit Frame</span>
        </button>

        <button class="admin-sidebar-item active" onclick="location.reload()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
            </path>
          </svg>
          <span>Edit Stiker</span>
        </button>

        <button class="admin-sidebar-item" onclick="window.location.href='folder.html'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
          </svg>
          <span>Folder Foto</span>
        </button>
      </nav>

      <div class="admin-sidebar-footer">
        <button class="admin-sidebar-item text-danger" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="admin-main">
      <div class="admin-topbar">
        <div class="admin-topbar-left">
          <h1 class="admin-topbar-title">Edit &amp; Upload Stiker ✨</h1>
          <span class="admin-topbar-subtitle" id="cabangLabel">Loading cabang...</span>
        </div>
      </div>

      <div class="admin-content">
        <div style="display:grid; grid-template-columns: 1fr 1.2fr; gap:var(--space-6); align-items:start;">

          <!-- Left: Upload Form Card -->
          <div class="setting-card">
            <h2 class="setting-card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
                </path>
              </svg>
              <span>Upload Stiker Baru</span>
            </h2>

            <p class="text-xs text-secondary mb-4">Upload berkas gambar stiker PNG dengan transparan background untuk
              dekorasi foto tamu.</p>

            <div class="upload-area mb-4" onclick="document.getElementById('stikerUpload').click()">
              <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <div class="upload-text">Klik untuk memilih file Stiker PNG <span>Cari berkas</span></div>
              <div class="upload-hint" id="fileHint">PNG Transparan disarankan</div>
              <input type="file" id="stikerUpload" accept="image/png,image/webp" style="display:none;"
                onchange="document.getElementById('fileHint').textContent = this.files[0]?.name || 'PNG Transparan disarankan'">
            </div>

            <div class="input-group mb-4">
              <label for="stikerName" class="input-label">Nama Stiker</label>
              <input type="text" id="stikerName" placeholder="misal: Bintang Emas / Heart Love" class="input">
            </div>

            <button onclick="uploadStiker()" id="btnUpload" class="btn btn-primary btn-block">
              <span>Upload Stiker</span>
            </button>

            <div id="msgStiker" class="badge badge-neutral p-3 w-full text-center mt-3 hidden"></div>
          </div>

          <!-- Right: Sticker Gallery List -->
          <div class="setting-card">
            <h2 class="setting-card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
                </path>
              </svg>
              <span>Daftar Stiker Tersedia</span>
            </h2>

            <div class="asset-grid" id="stikerList">
              <p class="text-xs text-tertiary">Loading stiker...</p>
            </div>
          </div>

        </div>
      </div>
    </main>

  </div>

  <script>
    function uploadStiker() { if (window._uploadStiker) window._uploadStiker(); }
    function toggleAktif(id, cur) { if (window._toggleAktif) window._toggleAktif(id, cur); }
    function hapusStiker(id, path) { if (window._hapusStiker) window._hapusStiker(id, path); }
    function logout() {
      localStorage.clear();
      window.location.href = "../index.html";
    }
  </script>

  <script type="module">
    import { supabase } from "../assets/js/supabase.js";

    const admin = JSON.parse(localStorage.getItem("currentAdmin"));
    const branchId = admin.branch_id;
    const adminId = admin.id;

    document.getElementById("cabangLabel").innerText =
      `Cabang: ${admin.branch_name ?? admin.username}`;

    async function loadStiker() {
      const list = document.getElementById("stikerList");

      const { data, error } = await supabase
        .from("stickers")
        .select("*")
        .eq("branch_id", branchId)
        .order("created_at", { ascending: false });

      if (error) { list.innerHTML = `<p class="text-xs text-danger">Gagal load: ${error.message}</p>`; return; }
      if (!data || data.length === 0) {
        list.innerHTML = `<div class="empty-state" style="grid-column:1/-1; padding:var(--space-8);"><div class="empty-state-icon">✨</div><div class="empty-state-title">Belum ada stiker</div><div class="empty-state-text">Upload stiker pertama kamu dengan form di sebelah kiri.</div></div>`;
        return;
      }

      list.innerHTML = "";
      data.forEach(stiker => {
        const card = document.createElement("div");
        card.className = "asset-card" + (!stiker.is_active ? " opacity-50" : "");
        card.innerHTML = `
          <img src="${stiker.url}" alt="${stiker.name}" style="background: repeating-conic-gradient(var(--bg-subtle) 0% 25%, #fff 0% 50%) 0 0 / 16px 16px;">
          <div style="padding:var(--space-2.5); display:flex; flex-direction:column; gap:4px;">
            <span class="text-xs font-bold truncate">${stiker.name}</span>
            <span class="badge ${stiker.is_active ? "badge-success" : "badge-danger"}" style="align-self:flex-start;">${stiker.is_active ? "Aktif" : "Nonaktif"}</span>
          </div>
          <div class="asset-card-overlay">
            <button class="btn btn-xs btn-outline" style="background:#fff; color:#000;" onclick="toggleAktif('${stiker.id}', ${stiker.is_active})">${stiker.is_active ? "Off" : "On"}</button>
            <button class="btn btn-xs btn-danger" onclick="hapusStiker('${stiker.id}', '${stiker.storage_path}')">Hapus</button>
          </div>
        `;
        list.appendChild(card);
      });
    }

    window._uploadStiker = async function () {
      const fileInput = document.getElementById("stikerUpload");
      const nameInput = document.getElementById("stikerName");
      const msg = document.getElementById("msgStiker");
      const btn = document.getElementById("btnUpload");

      const file = fileInput.files[0];
      const name = nameInput.value.trim();

      msg.classList.remove("hidden");

      if (!file) {
        msg.className = "badge badge-danger p-3 w-full text-center mt-3";
        msg.textContent = "❌ Pilih file stiker terlebih dahulu!"; return;
      }
      if (!name) {
        msg.className = "badge badge-danger p-3 w-full text-center mt-3";
        msg.textContent = "❌ Nama stiker wajib diisi!"; return;
      }

      btn.disabled = true;
      msg.className = "badge badge-warning p-3 w-full text-center mt-3";
      msg.textContent = "⏳ Mengupload stiker ke storage...";

      const ext = file.name.split(".").pop();
      const storagePath = `${branchId}/stickers/${Date.now()}.${ext}`;

      const { error: uploadError } = await supabase.storage
        .from("stickers")
        .upload(storagePath, file, { upsert: false });

      if (uploadError) {
        msg.className = "badge badge-danger p-3 w-full text-center mt-3";
        msg.textContent = "❌ Upload gagal: " + uploadError.message;
        btn.disabled = false;
        return;
      }

      const { data: urlData } = supabase.storage
        .from("stickers")
        .getPublicUrl(storagePath);

      const publicUrl = urlData.publicUrl;

      const { error: dbError } = await supabase
        .from("stickers")
        .insert([{
          branch_id: branchId,
          created_by: adminId,
          name: name,
          storage_path: storagePath,
          url: publicUrl,
          is_active: true
        }]);

      if (dbError) {
        msg.className = "badge badge-danger p-3 w-full text-center mt-3";
        msg.textContent = "❌ Gagal simpan ke database: " + dbError.message;
        btn.disabled = false;
        return;
      }

      msg.className = "badge badge-success p-3 w-full text-center mt-3";
      msg.textContent = "✅ Stiker berhasil diupload!";
      fileInput.value = "";
      nameInput.value = "";
      document.getElementById("fileHint").textContent = "PNG Transparan disarankan";
      btn.disabled = false;
      loadStiker();
    };

    window._toggleAktif = async function (id, currentStatus) {
      const { error } = await supabase
        .from("stickers")
        .update({ is_active: !currentStatus })
        .eq("id", id);

      if (error) { alert("Gagal update: " + error.message); return; }
      loadStiker();
    };

    window._hapusStiker = async function (id, storagePath) {
      if (!confirm("Yakin hapus stiker ini?")) return;

      await supabase.storage.from("stickers").remove([storagePath]);

      const { error } = await supabase.from("stickers").delete().eq("id", id);
      if (error) { alert("Gagal hapus: " + error.message); return; }

      loadStiker();
    };

    loadStiker();
  </script>

</body>

</html>
